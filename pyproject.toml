[project]
name = "hunter-v2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.40.61",
    "cairosvg>=2.8.2",
    "openpyxl>=3.1.5",
    "crispy-tailwind>=1.0.3",
    "django>=5.2.9",
    "django-crispy-forms>=2.5",
    "django-filter>=25.2",
    "django-htmx>=1.27.0",
    "django-localflavor>=5.0",
    "django-money>=3.5.4",
    "django-phonenumber-field[phonenumbers]>=8.4.0",
    "django-simple-history>=3.10.1",
    "django-tables2>=2.8.0",
    "django-tailwind-cli>=4.4.2",
    "psycopg[binary]>=3.3.2",
    "gunicorn>=23.0.0",
    "whitenoise>=6.11.0",
    "python-stdnum>=2.1",
    "requests>=2.32.5",
    "playwright>=1.55.0",
    "pillow>=11.3.0",
    "xhtml2pdf>=0.2.17",
    "pynfe>=0.6.5",
    "signxml>=4.2.2",
    "holidays>=0.96",
    "python-json-logger>=3.3.0",
    "opentelemetry-sdk>=1.32.0",
    "opentelemetry-exporter-otlp-proto-http>=1.32.0",
    "opentelemetry-instrumentation-logging>=0.53b0",
    "opentelemetry-instrumentation-django>=0.53b0",
    "opentelemetry-instrumentation-requests>=0.53b0",
    "opentelemetry-instrumentation-psycopg>=0.53b0",
    "pika>=1.3.2",
]

[dependency-groups]
dev = [
    "django-stubs>=5.2.8",
    "mypy>=1.19.0",
    "ruff>=0.14.8",
]

[tool.ruff]
line-length = 320

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
exclude = ["migrations"]
disallow_untyped_defs = true
disallow_any_unimported = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true
disable_error_code = [
    "arg-type",
    "assignment",
    "attr-defined",
    "call-arg",
    "call-overload",
    "dict-item",
    "index",
    "list-item",
    "misc",
    "name-defined",
    "no-untyped-def",
    "operator",
    "return-value",
    "union-attr",
    "unused-ignore",
    "valid-type",
]

[tool.django-stubs]
django_settings_module = "config.settings"
