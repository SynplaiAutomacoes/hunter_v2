<a href="{{ card.detail_url }}" class="card bg-base-200/60 hover:bg-base-200 shadow hover:shadow-md transition-shadow block">
    <div class="card-body p-3 gap-2">
        <div class="flex items-start justify-between gap-2">
            <div class="font-mono font-bold text-sm tracking-wide bg-white text-slate-900 border-2 border-slate-900 rounded px-2 py-0.5 shadow-sm whitespace-nowrap">
                {{ card.plate }}
            </div>
            <div class="text-right text-sm font-semibold text-base-content leading-tight min-w-0">
                {{ card.brand }} {{ card.model }}
            </div>
        </div>
        <div class="text-sm text-base-content/60 leading-snug">
            <span class="font-bold"># {{ card.show_id }}</span> {{ card.customer }}
        </div>
        {% if card.status_label %}
        <div class="text-xs font-semibold" style="color: {{ card.color }};">{{ card.status_label }}</div>
        {% endif %}
        {% if card.photo_url %}
        <div class="rounded-lg overflow-hidden">
            <img src="{{ card.photo_url }}" alt="Foto do veículo {{ card.plate }}" class="w-full h-36 object-cover" loading="lazy">
        </div>
        {% endif %}
        <div class="text-sm text-base-content/60 leading-snug">
            {% for name in card.responsibles %}
            <p>{{ name }}</p>
            {% endfor %}
        </div>
        <div class="flex items-center gap-1.5 text-sm font-semibold text-base-content pt-1 border-t border-base-300/60">
            <span class="material-icons text-base" style="color: {{ card.color }};">date_range</span>
            <span>{{ card.expected_label }}</span>
        </div>
    </div>
</a>
