{% extends 'crud/page.html' %}
{% block crud_content %}
<div class="mb-6 flex items-center justify-between gap-4">
    <div>
        <h1 class="text-3xl font-bold">Importação de Estoque</h1>
        <p class="text-base-content/70">Siga as etapas para dar entrada em mercadorias via Nota Fiscal.</p>
    </div>
</div>

<div class="card bg-base-100 shadow-xl" x-data="{ method: 'XML' }">
    <div class="card-body" id="step-container">
        {% include 'stock/partials/import_step_content.html' %}
    </div>
</div>
<div id="modal-container"></div>
<div id="child-modal-container"></div>

<script>
    (function() {
        window.closeStockParentModal = function() {
            const parentContainer = document.getElementById('modal-container');
            const childContainer = document.getElementById('child-modal-container');

            if (childContainer) {
                childContainer.innerHTML = '';
            }

            if (parentContainer) {
                parentContainer.innerHTML = '';
            }
        };

        window.closeStockChildModal = function() {
            const childContainer = document.getElementById('child-modal-container');
            if (childContainer) {
                childContainer.innerHTML = '';
            }
        };

        if (!window.__stockSupplierSavedBound) {
            window.__stockSupplierSavedBound = true;
            document.body.addEventListener('supplierSaved', function () {
                window.closeStockParentModal();
                window.location.reload();
            });
        }
    })();
</script>
{% endblock %}
