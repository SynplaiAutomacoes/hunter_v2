<div class="modal modal-open" x-data="{
    selectedIds: [],
    // Adiciona/Remove todos os IDs visíveis na lista
    toggleAll(e) {
        const checkboxes = document.querySelectorAll('.product-checkbox');
        if (e.target.checked) {
            checkboxes.forEach(cb => {
                if (!this.selectedIds.includes(cb.value)) this.selectedIds.push(cb.value);
            });
        } else {
            this.selectedIds = [];
        }
    },
    confirmBulkLink() {
        htmx.ajax('POST', '{% url 'stock:link_product_manual' %}', {
            values: {
                pk: '{{ pk }}',
                manual: '{{ is_manual|yesno:'true,false' }}',
                'product_ids[]': this.selectedIds
            },
            target: '#modal-container'
        });
    }
}">
    <div class="modal-box max-w-4xl">
        <h3 class="font-bold text-lg mb-4">Selecionar Produtos para Vínculo</h3>

        <div class="form-control w-full mb-4">
            <input type="text" name="product_search" class="input input-bordered w-full"
                   placeholder="Pesquise por código, nome ou marca..."
                   hx-get="{% url 'stock:stock_product_search' %}"
                   hx-trigger="keyup changed delay:500ms text-sm"
                   hx-target="#search-results-rows">
        </div>

        <div class="overflow-x-auto max-h-96 border border-base-300 rounded-box">
            <table class="table table-sm table-zebra w-full">
                <thead class="sticky top-0 bg-base-200 z-10">
                    <tr>
                        <th class="w-10">
                            <input type="checkbox" class="checkbox checkbox-primary checkbox-sm" @change="toggleAll($event)">
                        </th>
                        <th>Produto</th>
                        <th class="text-right">Valor de Venda</th>
                    </tr>
                </thead>
                <tbody id="search-results-rows"
                       hx-get="{% url 'stock:stock_product_search' %}"
                       hx-trigger="load">
                </tbody>
            </table>
        </div>

        <div class="modal-action flex justify-between items-center">
            <div class="text-sm font-medium">
                <span x-text="selectedIds.length"></span> itens selecionados
            </div>
            <div class="flex gap-2">
                <button class="btn btn-ghost" onclick="document.getElementById('modal-container').innerHTML=''">Fechar</button>
                <button class="btn btn-success" 
                        :disabled="selectedIds.length === 0"
                        @click="confirmBulkLink()">
                    <span class="material-icons text-sm">link</span>
                    Vincular Selecionados
                </button>
            </div>
        </div>
    </div>
</div>
