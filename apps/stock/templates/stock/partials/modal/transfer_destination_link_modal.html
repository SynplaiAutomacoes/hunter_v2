{% load l10n %}
<div class="modal modal-open" x-data="{
    confirmLink(product) {
        htmx.ajax('POST', '{% url 'stock:transfer_destination_link' %}', {
            values: {
                item_idx: '{{ item_idx|default:'' }}',
                pk: '{{ pk|unlocalize }}',
                product_id: product.id
            },
            target: '#modal-container'
        });
    }
}">
    <div class="modal-box max-w-4xl">
        <h3 class="font-bold text-lg mb-4">Vincular Item a um Produto</h3>

        <div class="form-control w-full mb-4">
            <input type="text"
                   name="product_search"
                   class="input input-bordered w-full"
                   placeholder="Pesquise por código, nome ou marca..."
                   hx-get="{% url 'stock:transfer_destination_product_search' %}?destination_workshop={{ destination_workshop.pk }}"
                   hx-trigger="keyup changed delay:500ms"
                   hx-target="#transfer-destination-results">
        </div>

        <div class="overflow-x-auto max-h-96 border border-base-300 rounded-box">
            <table class="table table-sm table-zebra w-full">
                <thead class="sticky top-0 bg-base-200">
                    <tr>
                        <th>Produto</th>
                        <th class="text-right">Valor de Venda</th>
                        <th class="text-center">Ações</th>
                    </tr>
                </thead>
                <tbody id="transfer-destination-results"
                       hx-get="{% url 'stock:transfer_destination_product_search' %}?destination_workshop={{ destination_workshop.pk }}"
                       hx-trigger="load">
                </tbody>
            </table>
        </div>

        <div class="modal-action">
            <button class="btn btn-ghost" onclick="document.getElementById('modal-container').innerHTML=''">Fechar</button>
        </div>
    </div>
</div>
