{% load static %}
{% if SUPPORT_CHAT_VISIBLE %}
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.9/dist/purify.min.js" crossorigin="anonymous"></script>
<div id="support-chat-root">
  <button id="support-chat-fab" aria-label="Abrir chat de suporte"
    class="btn btn-circle btn-primary shadow-lg fixed bottom-6 right-6 z-[150] w-20 h-20 p-1">
    <img src="{% static 'image/assistent_chat_image.png' %}" alt="Hunter Boss" class="w-full h-full rounded-full object-cover" />
  </button>
  <div id="support-chat-panel" class="hidden fixed bottom-24 right-6 z-[150] w-[380px] max-w-[calc(100vw-3rem)] h-[560px] max-h-[70vh] card bg-base-100 shadow-2xl border border-base-300 flex-col overflow-hidden">
    <div class="flex items-center gap-2 px-4 py-3 bg-primary text-primary-content">
      <button id="support-chat-back" class="btn btn-ghost btn-sm text-primary-content hidden" aria-label="Voltar para a Home"><span class="material-icons text-3xl leading-none">arrow_back</span></button>
      <div class="flex-1">
        <div class="font-semibold">Hunter Boss</div>
        <div class="text-xs opacity-80">Suporte e dados da oficina</div>
      </div>
      <button id="support-chat-close" class="btn btn-ghost btn-sm text-primary-content text-xl" aria-label="Fechar chat">✕</button>
    </div>

    <div class="flex-1 overflow-hidden flex flex-col">
      <div id="support-chat-view-home" class="flex-1 flex flex-col items-center justify-center gap-4 p-6 text-center">
        <h2 class="text-xl font-semibold">Olá 👋, como podemos te ajudar?</h2>
        <button id="support-chat-start-btn" type="button" class="btn btn-primary">Envie uma mensagem para nós<span class="material-icons pl-4 text-xl">send</span></button>
      </div>

      <div id="support-chat-view-session" class="hidden flex-1 flex-col overflow-hidden">
        <div id="support-chat-messages" role="log" aria-live="polite" class="flex-1 overflow-y-auto p-3 space-y-2 text-sm"></div>
        <div id="support-chat-chips" class="flex flex-wrap gap-2 px-3 pb-2"></div>
        <form id="support-chat-form" class="p-3 border-t border-base-300 flex gap-2">
          {% csrf_token %}
          <input id="support-chat-input" type="text" maxlength="2000" autocomplete="off"
            placeholder="Digite sua pergunta..." class="input input-bordered input-sm flex-1" />
          <button id="support-chat-send" type="submit" class="btn btn-primary btn-sm">Enviar</button>
          <button id="support-chat-cancel" type="button" class="btn btn-ghost btn-sm hidden">Cancelar</button>
        </form>
      </div>

      <div id="support-chat-view-messages" class="hidden flex-1 flex-col overflow-hidden">
        <div class="p-3 border-b border-base-300">
          <button id="support-chat-start-btn-2" type="button" class="btn btn-primary text-sm btn-sm w-full">Envie uma mensagem para nós<span class="material-icons pl-2 text-lg">help</span></button>
        </div>
        <div id="support-chat-titles" class="flex-1 overflow-y-auto p-2 space-y-1 text-sm"></div>
      </div>
    </div>

    <div class="border-t border-base-300 grid grid-cols-2">
      <button id="support-chat-nav-home" type="button" class="btn btn-ghost rounded-none h-14 gap-2 hover:text-primary"><span class="material-icons">home</span>Home</button>
      <button id="support-chat-nav-messages" type="button" class="btn btn-ghost rounded-none h-14 gap-2 hover:text-primary"><span class="material-icons">message</span>Mensagens</button>
    </div>
  </div>
</div>
<script defer src="/static/js/support-chat.js"></script>
{% endif %}
