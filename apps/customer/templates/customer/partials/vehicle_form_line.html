{% load crispy_forms_tags %}
<div style="border: 1px solid #d1d5db; border-radius: 12px !important; gap: 3vh;" class="vehicle-item p-4 mb-4 flex flex-col">

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-4">
        {% for field in v_form %}
            {% if not field.is_hidden %}
                <div class="col-span-12 lg:col-span-4">
                    {{ field|as_crispy_field }}
                </div>
            {% else %}
                {{ field }}
            {% endif %}
        {% endfor %}
    </div>

    <div class="flex justify-end mt-2">
        <button type="button" class="btn btn-ghost btn-xs text-error flex items-center gap-1" onclick="this.closest('.vehicle-item').remove()">
            <span class="material-icons text-sm">delete</span>
            <span style="font-size: 0.75rem;">Remover</span>
        </button>
    </div>
</div>
