{% load crispy_forms_tags %}
<div style="border: 1px solid #d1d5db; border-radius: 12px !important; overflow: hidden;" class="vehicle-item p-4 border border-gray-300 rounded-lg grid grid-cols-1 lg:grid-cols-12 gap-4 relative mb-4 overflow-hidden">

    <div class="col-span-12 lg:col-span-11 grid grid-cols-1 lg:grid-cols-12 gap-4">
        {% for field in v_form %}
            {% if not field.is_hidden %}
                <div class="col-span-12 lg:col-span-4">
                    {{ field|as_crispy_field }}
                </div>
            {% else %}
                {{ field }}
            {% endif %}
        {% endfor %}
    </div>

    <div class="col-span-12 lg:col-span-1 flex items-center justify-center pt-4 lg:pt-0">
        <button type="button" class="text-red-500 hover:text-red-700 transition-colors" onclick="this.closest('.vehicle-item').remove()">
            <i class="fas fa-trash"></i>
        </button>
    </div>
</div>
