<div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
    <div>
        <label for="{{ table_id }}-filter-customer-type">Tipo</label>
        <select name="customer_type" id="{{ table_id }}-filter-customer-type" class="select select-bordered w-full">
            <option value="">Todos</option>
            <option value="PF" {% if request.GET.customer_type == 'PF' %}selected{% endif %}>Pessoa Física</option>
            <option value="PJ" {% if request.GET.customer_type == 'PJ' %}selected{% endif %}>Pessoa Jurídica</option>
        </select>
    </div>

    <div>
        <label for="{{ table_id }}-filter-status">Status</label>
        <select name="is_active" id="{{ table_id }}-filter-status" class="select select-bordered w-full">
            <option value="">Ativos</option>
            <option value="all" {% if request.GET.is_active == 'all' %}selected{% endif %}>Todos</option>
            <option value="0" {% if request.GET.is_active == '0' %}selected{% endif %}>Inativo</option>
        </select>
    </div>

    <div>
        <label for="{{ table_id }}-filter-city">Cidade</label>
        <input
            type="text"
            name="city"
            id="{{ table_id }}-filter-city"
            value="{{ request.GET.city|default:'' }}"
            placeholder="Digite a cidade"
            class="input-theme"
        />
    </div>

    <div>
        <label for="{{ table_id }}-filter-state">UF</label>
        <select name="state" id="{{ table_id }}-filter-state" class="select select-bordered w-full">
            <option value="">Todos</option>
            {% for value, label in state_choices %}
                {% if value %}
                    <option value="{{ value }}" {% if request.GET.state == value %}selected{% endif %}>{{ label }}</option>
                {% endif %}
            {% endfor %}
        </select>
    </div>
</div>
