<div x-data="{ 
    totalForms: {{ vehicles.management_form.TOTAL_FORMS.value }} 
}" 
x-on:htmx:after-swap.window="if($event.detail && $event.detail.target && $event.detail.target.id === 'vehicle-list') totalForms = document.querySelectorAll('.vehicle-item').length"
x-on:vehicle-list:changed.window="totalForms = document.querySelectorAll('.vehicle-item').length">
    
    <input type="hidden" 
           name="vehicles-TOTAL_FORMS" 
           id="id_vehicles-TOTAL_FORMS" 
           :value="totalForms">
    
    {{ vehicles.management_form.INITIAL_FORMS }}
    {{ vehicles.management_form.MIN_NUM_FORMS }}
    {{ vehicles.management_form.MAX_NUM_FORMS }}

    <div id="vehicle-list" class="space-y-4">
        {% for v_form in vehicles %}
            {% include "customer/partials/vehicle_form_line.html" with v_form=v_form %}
        {% endfor %}
    </div>
    <script>
        document.addEventListener('change', async (e) => {
            // Verifica se o alvo é um input de placa
            if (e.target.name && e.target.name.includes('-plate')) {
                const plate = e.target.value.replace(/[^a-zA-Z0-9]/g, '').trim();
                if (plate.length < 7) return;

                const row = e.target.closest('.vehicle-item'); // ou o seletor da sua linha

                try {
                    const response = await fetch(`/customer/check-plate/${plate}/`);
                    if (!response.ok) throw new Error('Não encontrado');

                    const data = await response.json();

                    // Preenchimento automático dos campos da mesma linha
                    fillField(row, '-brand', data.brand);
                    fillField(row, '-model', data.model);
                    fillField(row, '-year_fabrication', data.year_fabrication);
                    fillField(row, '-year_model', data.year_model);
                    fillField(row, '-color', data.color);
                    fillField(row, '-fuel', data.fuel);
                    fillField(row, '-chassi', data.chassi);
                    fillField(row, '-engine', data.engine);
                    fillField(row, '-type', data.type);

                    const missingFields = [];
                    if (!data.engine) missingFields.push('Motor');
                    if (!data.fuel) missingFields.push('Combustível');

                    if (missingFields.length > 0) {
                        document.body.dispatchEvent(new CustomEvent('showToast', {
                            detail: {
                                message: `Campos não disponíveis: ${missingFields.join(', ')}`,
                                type: 'warning'
                            }
                        }));
                    }

                } catch (err) {
                    console.error("Erro ao buscar placa:", err);
                }
            }
        });

        function fillField(container, suffix, value) {
            if (!value) return;
            const input = container.querySelector(`[name$="${suffix}"]`);
            if (!input) return;

            const widgetContainer = input.closest('[x-data]');
            if (widgetContainer) {
                widgetContainer.dispatchEvent(new CustomEvent('searchable-set-value', {
                    detail: { value: String(value) },
                    bubbles: true,
                }));
                return;
            }

            input.value = value;
            input.dispatchEvent(new Event('input', { bubbles: true }));
            input.dispatchEvent(new Event('change', { bubbles: true }));
        }
    </script>
</div>
