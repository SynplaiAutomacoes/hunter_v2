<div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
    <fieldset class="sm:col-span-2">
        <legend class="label-text font-medium">Status</legend>
        <div class="mt-2 grid gap-2 rounded-box border border-base-300 bg-base-100 p-3 sm:grid-cols-2">
            {% for value, label in status_choices %}
                <label class="flex cursor-pointer select-none items-center gap-3 rounded-md px-2 py-1 hover:bg-base-200/70">
                    <input type="checkbox" name="status" value="{{ value }}" class="checkbox checkbox-sm" {% if value in selected_status_values %}checked{% endif %} />
                    <span class="text-sm text-base-content">{{ label }}</span>
                </label>
            {% endfor %}
        </div>
    </fieldset>

    <div class="sm:col-span-2">
        <label for="{{ table_id }}-filter-assignee">Responsável</label>
        <select name="assignee" id="{{ table_id }}-filter-assignee" class="select select-bordered w-full">
            <option value="">Todos</option>
            {% for developer in developer_users %}
                <option value="{{ developer.pk }}" {% if selected_assignee_id == developer.pk|stringformat:'s' %}selected{% endif %}>{{ developer.username }}</option>
            {% endfor %}
        </select>
    </div>
</div>
