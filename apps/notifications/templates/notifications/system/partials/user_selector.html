<select name="users" multiple class="select select-bordered w-full h-32">
    {% for user in users %}
        <option value="{{ user.id }}" {% if selected_user_ids and user.id in selected_user_ids %}selected{% endif %}>
            {{ user.username }} {% if user.get_full_name %}({{ user.get_full_name }}){% endif %} - {{ user.email }}
        </option>
    {% empty %}
        <option disabled>Nenhum usuário encontrado</option>
    {% endfor %}
</select>
