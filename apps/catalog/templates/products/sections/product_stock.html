{% load l10n %}
<section class="card bg-base-100 shadow-md">
  <div class="card-body">
    <div class="flex justify-between items-center gap-4">
      <h2 class="text-lg font-semibold">Informações de Estoque</h2>
      <button
        type="button"
        class="btn btn-primary btn-sm"
        hx-get="{% url 'catalog:stock_adjust' product_id=product.id %}"
        hx-target="#modal-container"
        hx-swap="innerHTML"
      >
        Ajustar estoque
      </button>
    </div>
    <div class="mt-2 border-b-2 border-primary w-full mb-6"></div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      {% csrf_token %}

      <div class="form-control">
        <label class="label"><span class="label-text">Quantidade em Estoque</span></label>
        <input type="number" step="any" value="{{ stock_obj.current_quantity|unlocalize }}" readonly
               class="input input-bordered w-full bg-base-200 cursor-not-allowed" />
      </div>

      <div class="form-control">
        <label class="label"><span class="label-text">Estoque Mínimo</span></label>
        <input type="number" step="any"
               name="minimum_quantity"
               value="{{ stock_obj.minimum_quantity|unlocalize }}"
               class="input input-bordered w-full"
               hx-post="{% url 'catalog:update_stock_fields' %}"
               hx-trigger="blur"
               hx-swap="innerHTML"
               hx-vals='{"product_id": "{{ product.id|unlocalize }}"}'>
      </div>

      <div class="form-control">
        <label class="label"><span class="label-text">Estoque Ideal (Meta)</span></label>
        <input type="number" step="any"
               name="restock_quantity"
               value="{{ stock_obj.restock_quantity|unlocalize }}"
               class="input input-bordered w-full"
               hx-post="{% url 'catalog:update_stock_fields' %}"
               hx-trigger="blur"
               hx-swap="innerHTML"
               hx-vals='{"product_id": "{{ product.id|unlocalize }}"}'>
      </div>
    </div>
  </div>
</section>
