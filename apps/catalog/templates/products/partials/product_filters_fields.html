<div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
    <div>
        <label for="{{ table_id }}-filter-group">Grupo</label>
        <select name="group" id="{{ table_id }}-filter-group" class="select select-bordered w-full">
            <option value="">Todos</option>
            {% for value, label in group_choices %}
                <option value="{{ value }}" {% if request.GET.group == value %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
        </select>
    </div>

    <div>
        <label for="{{ table_id }}-filter-status">Status</label>
        <select name="is_active" id="{{ table_id }}-filter-status" class="select select-bordered w-full">
            <option value="">Ativos</option>
            <option value="all" {% if request.GET.is_active == 'all' %}selected{% endif %}>Todos</option>
            <option value="0" {% if request.GET.is_active == '0' %}selected{% endif %}>Inativos</option>
        </select>
    </div>

    <div>
        <label for="{{ table_id }}-filter-unit">Unidade</label>
        <select name="unit" id="{{ table_id }}-filter-unit" class="select select-bordered w-full">
            <option value="">Todas</option>
            {% for value, label in unit_choices %}
                <option value="{{ value }}" {% if request.GET.unit == value %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
        </select>
    </div>

    <div>
        <label for="{{ table_id }}-filter-brand">Marca</label>
        <input
            type="text"
            name="brand"
            id="{{ table_id }}-filter-brand"
            value="{{ request.GET.brand|default:'' }}"
            placeholder="Digite a marca"
            class="input-theme"
        />
    </div>

    <div class="sm:col-span-2">
        <label for="{{ table_id }}-filter-location">Localização</label>
        <input
            type="text"
            name="location"
            id="{{ table_id }}-filter-location"
            value="{{ request.GET.location|default:'' }}"
            placeholder="Digite a localização"
            class="input-theme"
        />
    </div>
</div>
