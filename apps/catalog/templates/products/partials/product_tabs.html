<style>
    /* base das abas (efeito flutuante) */
    .tabs-lift .tab {
        @apply bg-base-100 border border-base-300 shadow-md rounded-xl mx-1 px-4 py-2;
        transform: translateY(2px);
        opacity: 0.85;
        transition: all 0.2s ease;
    }

    /* hover reforça sensação de elevação */
    .tabs-lift .tab:hover {
        transform: translateY(0px);
        opacity: 1;
        @apply shadow-lg;
    }

    /* aba ativa */
    .tabs-lift input:checked + label.tab {
        @apply bg-primary text-primary-content shadow-xl;
        transform: translateY(0px);
        opacity: 1;
        border-color: var(--p);
    }
</style>

<div class="tabs tabs-lift mt-7">

    <input type="radio" name="product_tabs" value="cadastro" x-model="activeTab" class="hidden" id="tab-cadastro" checked>
    <label for="tab-cadastro" class="tab">Cadastro</label>

    <input type="radio" name="product_tabs" value="atribuicao_kit" x-model="activeTab" class="hidden" id="tab-kit">
    <label for="tab-kit" class="tab">Atribuição a Kits</label>

    <input type="radio" name="product_tabs" value="estoque" x-model="activeTab" class="hidden" id="tab-estoque">
    <label for="tab-estoque" class="tab">Estoque</label>

    <input type="radio" name="product_tabs" value="historico" x-model="activeTab" class="hidden" id="tab-historico">
    <label for="tab-historico" class="tab">Histórico</label>

    <input type="radio" name="product_tabs" value="movimentacao" x-model="activeTab" class="hidden" id="tab-mov">
    <label for="tab-mov" class="tab">Movimentação</label>

</div>
