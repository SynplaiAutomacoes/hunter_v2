{% for product in products %}
<li class="px-2">
    <label class="flex items-start gap-3 py-2 cursor-pointer">
        <input
            type="checkbox"
            class="checkbox checkbox-sm mt-1"
            :checked="modalSelectedProducts.some(i => i.id == '{{ product.id }}')"
            @change="toggleModalProduct({ id: '{{ product.id }}', name: '{{ product.code }} - {{ product.name|escapejs }}' })"
        />

        <div class="flex flex-col items-start text-left w-full">
            <span class="font-bold text-sm">{{ product.name }}</span>
            <div class="text-xs text-gray-500 mt-0.5">
                <span class="font-mono bg-base-200 px-1 rounded">{{ product.code }}</span>
                {% if product.brand %}
                    <span class="mx-1">|</span> {{ product.brand }}
                {% endif %}
            </div>
        </div>
    </label>
</li>
{% empty %}
<li class="px-3 py-2 text-sm text-gray-500 italic">Nenhum produto encontrado.</li>
{% endfor %}

{% if page_obj.has_next %}
<li id="kit-product-load-more" class="px-2 py-2">
    <button
        type="button"
        class="btn btn-ghost btn-sm w-full"
        hx-get="{% url 'catalog:kits_product_search' %}?page={{ page_obj.next_page_number }}&product_search={{ query|urlencode }}"
        hx-target="#kit-product-load-more"
        hx-swap="outerHTML"
    >
        Carregar mais
    </button>
</li>
{% endif %}
