<div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
    <div>
        <label for="{{ table_id }}-filter-status">Status</label>
        <select name="is_active" id="{{ table_id }}-filter-status" class="select select-bordered w-full">
            <option value="">Todos</option>
            <option value="1" {% if request.GET.is_active == '1' %}selected{% endif %}>Ativo</option>
            <option value="0" {% if request.GET.is_active == '0' %}selected{% endif %}>Inativo</option>
        </select>
    </div>

    <div>
        <label for="{{ table_id }}-filter-third-party">Serviço de Terceiro</label>
        <select name="is_third_party" id="{{ table_id }}-filter-third-party" class="select select-bordered w-full">
            <option value="">Todos</option>
            <option value="1" {% if request.GET.is_third_party == '1' %}selected{% endif %}>Sim</option>
            <option value="0" {% if request.GET.is_third_party == '0' %}selected{% endif %}>Não</option>
        </select>
    </div>
</div>
