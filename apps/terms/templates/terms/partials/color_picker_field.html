<div
    class="term-color-field rounded-xl border border-base-300 bg-base-200/20 p-4"
    data-term-color-field
    data-field-name="{{ field_name }}"
    data-default="{{ default_value }}"
>
    <div class="flex items-start justify-between gap-3">
        <div class="min-w-0">
            <p class="text-sm font-semibold text-base-content">{{ label }}</p>
            {% if help_text %}
                <p class="mt-1 text-xs text-base-content/60">{{ help_text }}</p>
            {% endif %}
        </div>
        <button type="button" class="btn btn-ghost btn-xs shrink-0" data-term-color-reset>Restaurar</button>
    </div>
    <div class="mt-3 flex items-center gap-3">
        <label
            class="relative block h-11 w-11 shrink-0 cursor-pointer overflow-hidden rounded-lg border-2 border-base-300 shadow-sm"
            data-term-color-swatch
            style="background-color: {{ value }};"
            title="Escolher {{ label|lower }}"
        >
            <input
                type="color"
                value="{{ value }}"
                class="absolute -inset-2 h-[calc(100%+16px)] w-[calc(100%+16px)] cursor-pointer border-0 p-0 opacity-0"
                data-term-color-picker
                aria-label="Escolher {{ label }}"
            />
        </label>
        <div class="flex min-w-0 flex-1 flex-col gap-1">
            <span class="text-[11px] font-semibold uppercase tracking-wider text-base-content/50">Hex</span>
            <input
                type="text"
                name="{{ field_name }}"
                value="{{ value }}"
                class="input input-bordered input-sm w-full max-w-[8.5rem] font-mono text-sm uppercase"
                maxlength="7"
                pattern="#([A-Fa-f0-9]{6})"
                placeholder="#000000"
                data-term-color-text
                aria-label="Código hexadecimal de {{ label }}"
            />
        </div>
    </div>
</div>
