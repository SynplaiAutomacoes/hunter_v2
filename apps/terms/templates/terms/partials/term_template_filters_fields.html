<div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
    <div>
        <label for="{{ table_id }}-filter-template-type">Tipo</label>
        <select name="template_type" id="{{ table_id }}-filter-template-type" class="select select-bordered w-full">
            <option value="">Todos</option>
            <option value="vehicle_receipt" {% if request.GET.template_type == 'vehicle_receipt' %}selected{% endif %}>Termo de Recebimento</option>
            <option value="warranty" {% if request.GET.template_type == 'warranty' %}selected{% endif %}>Termo de Garantia</option>
        </select>
    </div>

    <div>
        <label for="{{ table_id }}-filter-status">Status</label>
        <select name="is_active" id="{{ table_id }}-filter-status" class="select select-bordered w-full">
            <option value="">Ativos</option>
            <option value="all" {% if request.GET.is_active == 'all' %}selected{% endif %}>Todos</option>
            <option value="0" {% if request.GET.is_active == '0' %}selected{% endif %}>Inativos</option>
        </select>
    </div>
</div>
