<!-- apps/workshops/templates/workshop_costs/partials/workshop_cost_calculation_results.html -->
{% load crispy_forms_tags %}

<div class="col-span-12 mb-4"><span class="badge badge-neutral">Cálculos automáticos</span></div>

<div class="col-span-12">
    {{ form.total_value|as_crispy_field }}
</div>
<div class="col-span-12 lg:col-span-6">
    {{ form.total_monthly_costs|as_crispy_field }}
</div>
<div class="col-span-12 lg:col-span-6">
    {{ form.profit_target|as_crispy_field }}
</div>
<div class="col-span-12 lg:col-span-6">
    {{ form.gross_revenue_target|as_crispy_field }}
</div>
<div class="col-span-12 lg:col-span-6">
    {{ form.profitability_multiplier|as_crispy_field }}
</div>
