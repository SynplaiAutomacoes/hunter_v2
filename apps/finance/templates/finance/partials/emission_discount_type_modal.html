<form method="post" action="?step={{ current_step }}">
    {% csrf_token %}
    <input type="hidden" name="note_mode" value="{{ note_mode }}">

    <div class="modal-box max-w-lg">
        <button type="button"
                class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2"
                onclick="this.closest('dialog').close()"
                aria-label="Fechar">✕</button>

        <h3 class="font-bold text-xl text-base-content mb-3">Alterar Tipo de Desconto?</h3>

        <p class="text-base text-base-content/80 leading-relaxed">{{ message|safe }}</p>

        <div class="modal-action flex-col sm:flex-row gap-3 mt-6">
            <button type="submit"
                    name="discount_type_override"
                    value="{{ suggested_override }}"
                    class="btn btn-primary flex-1">
                Sim, alterar para {{ suggested_label }}
            </button>

            <button type="submit"
                    name="discount_type_override"
                    value=""
                    class="btn btn-outline flex-1">
                Manter {{ current_label }}
            </button>
        </div>
    </div>
</form>
