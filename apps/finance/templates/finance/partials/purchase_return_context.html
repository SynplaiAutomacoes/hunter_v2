<div class="rounded-xl border border-base-300 bg-base-200/30 p-4">
    <dl class="grid grid-cols-1 gap-3 text-sm sm:grid-cols-2 lg:grid-cols-4">
        <div>
            <dt class="text-base-content/60">Fornecedor</dt>
            <dd class="font-semibold">{{ source.supplier_name|default:"—" }}</dd>
        </div>
        <div>
            <dt class="text-base-content/60">NF-e origem</dt>
            <dd class="font-semibold">{{ document.number|default:source.nf_number_display }} / Série {{ document.series|default:"—" }}</dd>
        </div>
        <div>
            <dt class="text-base-content/60">Itens a devolver</dt>
            <dd class="font-semibold">{{ selected_items|length }}</dd>
        </div>
        <div>
            <dt class="text-base-content/60">Total</dt>
            <dd class="font-semibold">R$ {{ total_value|floatformat:2 }}</dd>
        </div>
    </dl>
</div>
