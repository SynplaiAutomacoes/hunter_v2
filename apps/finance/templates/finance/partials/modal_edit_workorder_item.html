{% if form.non_field_errors %}
    <div class="alert alert-error mb-4">
        {{ form.non_field_errors|join:", " }}
    </div>
{% endif %}

<div class="modal-box w-11/12 max-w-4xl bg-base-100 p-0 overflow-hidden">
    <div class="p-6 border-b border-base-200 flex justify-between items-center bg-base-50">
        <h3 class="font-bold text-xl flex items-center gap-2">
            <span class="material-icons text-primary">edit</span>
            Editar item da emissão — O.S. #{{ workorder.public_number }}
        </h3>
        <button type="button" class="btn btn-sm btn-circle btn-ghost" onclick="window.closeEmissionModal && window.closeEmissionModal()">✕</button>
    </div>

    <form
        hx-post="{% url 'finance:emission_workorder_item_edit' workorder.pk item.pk %}"
        hx-target="#modal-container"
        hx-swap="innerHTML"
        class="p-6 space-y-4">
        {% csrf_token %}

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            {% include "workorder/partials/modals/modal_edit_item_form.html" %}
        </div>

        <div class="pt-4 border-t border-base-200 flex justify-end gap-2">
            <button type="button" class="btn btn-ghost" onclick="window.closeEmissionModal && window.closeEmissionModal()">Cancelar</button>
            <button type="submit" class="btn btn-primary">Salvar</button>
        </div>
    </form>
</div>
