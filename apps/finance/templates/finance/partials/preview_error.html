<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }}</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: linear-gradient(180deg, #f8fafc 0%, #eef2f7 100%);
            color: #172033;
        }

        .card {
            width: min(100%, 640px);
            background: #ffffff;
            border: 1px solid #d7deea;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(15, 23, 42, 0.08);
            padding: 32px;
        }

        .eyebrow {
            display: inline-block;
            padding: 8px 12px;
            border-radius: 999px;
            background: #fff1f2;
            color: #be123c;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        h1 {
            margin: 18px 0 12px;
            font-size: 30px;
            line-height: 1.15;
        }

        p {
            margin: 0;
            color: #526072;
            line-height: 1.6;
        }

        .message {
            margin-top: 20px;
            border-radius: 18px;
            background: #f8fafc;
            border: 1px solid #d7deea;
            padding: 16px 18px;
            color: #172033;
        }
    </style>
</head>
<body>
    <main class="card">
        <span class="eyebrow">Prévia indisponível</span>
        <h1>{{ title }}</h1>
        <p>A prévia ainda não pode ser exibida neste momento. Tente novamente em alguns segundos.</p>
        <div class="message">{{ message }}</div>
    </main>
</body>
</html>
