<dialog
  id="financial-movement-delete-modal"
  class="modal"
  x-data="{}"
  x-ref="deleteFinancialMovementModal"
  x-init="$nextTick(() => $el.showModal())"
  @click="if ($event.target === $el) $el.close()"
  @close="$el.remove()"
>
  <div class="modal-box">
    <h3 class="text-lg font-bold text-base-content">
      Excluir Movimentacao Financeira
    </h3>
    <p class="text-base-content/70 mt-1">Esta ação não pode ser desfeita.</p>

    <div class="alert alert-warning mt-4">
      <span class="material-icons">warning</span>
      <div>
        <div class="font-semibold">Confirmar exclusão</div>
        <div class="text-sm">
          Tem certeza que deseja excluir esta movimentacao financeira
          <span class="font-medium"
            >{{ object.description|default:object.source }}</span
          >?
        </div>
      </div>
    </div>

    <form
      method="post"
      class="modal-action"
      hx-post="{{ request.path }}"
      hx-target="closest dialog"
      hx-swap="outerHTML"
    >
      {% csrf_token %}
      <button type="button" class="btn btn-ghost" @click="$refs.deleteFinancialMovementModal.close()">Cancelar</button>
      <button type="submit" class="btn btn-error">Excluir</button>
    </form>
  </div>
  <form method="dialog" class="modal-backdrop">
    <button>Fechar</button>
  </form>
</dialog>
