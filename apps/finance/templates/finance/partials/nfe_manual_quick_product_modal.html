{% load crispy_forms_tags %}
<div class="modal-box w-11/12 max-w-2xl max-h-[90vh] overflow-y-auto bg-base-100 shadow-2xl border border-base-300">
    <h3 class="mb-2 flex items-center gap-2 text-2xl font-bold">
        <span class="material-icons">add_box</span>
        Cadastro rápido de produto
    </h3>
    <p class="mb-6 text-sm text-base-content/65">O produto será cadastrado no catálogo da oficina. Nenhuma movimentação de estoque será criada.</p>
    <form hx-post="{% url 'finance:emission_manual_quick_product' %}" hx-target="#modal-container" hx-swap="innerHTML" class="space-y-4">
        {% csrf_token %}
        {{ form|crispy }}
        <div class="modal-action">
            <button type="button" class="btn btn-ghost" onclick="document.getElementById('form_modal').close()">Cancelar</button>
            <button type="submit" class="btn btn-primary">Cadastrar e usar</button>
        </div>
    </form>
</div>
