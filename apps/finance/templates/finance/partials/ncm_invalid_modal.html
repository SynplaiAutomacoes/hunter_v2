<dialog id="ncm-invalid-modal" class="modal">
    <div class="modal-box max-w-lg border border-error/30 bg-base-100 shadow-2xl">
        <div class="flex flex-col items-center gap-4 py-2 text-center">
            <span class="material-icons text-6xl text-error">error</span>
            <div class="space-y-2">
                <h3 class="text-xl font-semibold text-base-content">{{ ncm_invalid_modal.title }}</h3>
                <p class="text-sm leading-6 text-base-content/70">{{ ncm_invalid_modal.subtitle }}</p>
            </div>
        </div>

        <div class="modal-action justify-center">
            <button type="button" class="btn btn-ghost" onclick="document.getElementById('ncm-invalid-modal').close()">Fechar</button>
            <a href="{{ ncm_invalid_modal.action_url }}" class="btn btn-error gap-2">
                <span class="material-icons text-sm">edit</span>
                {{ ncm_invalid_modal.action_label }}
            </a>
        </div>
    </div>
    <form method="dialog" class="modal-backdrop">
        <button type="submit">close</button>
    </form>
</dialog>

<script>
    (function () {
        const modal = document.getElementById('ncm-invalid-modal');
        if (!modal || modal.dataset.bound === 'true') {
            return;
        }

        modal.dataset.bound = 'true';
        if (!modal.open) {
            modal.showModal();
        }
    })();
</script>
