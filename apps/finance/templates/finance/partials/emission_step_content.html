{% load crispy_forms_tags %}
{% include 'navbar/stepper.html' %}

<div class="flex items-center justify-between mb-6 gap-3 flex-wrap">
    {% if previous_step %}
        <button type="button"
                hx-get="{% url 'finance:emission_create' %}?step={{ previous_step }}"
                hx-target="#step-container"
                hx-push-url="true"
                class="btn btn-outline">
            <span class="material-icons">arrow_back</span> Voltar
        </button>
    {% else %}
        <div></div>
    {% endif %}

    <div class="flex items-center gap-3 flex-wrap justify-end">
        {% for action in created_request_actions %}
            <a href="{{ action.url }}" class="btn btn-outline">{{ action.label }}</a>
        {% endfor %}
        <a href="{{ close_emission_url }}" class="btn btn-ghost">Fechar emissao</a>
        <button type="submit" form="emission-form" class="btn btn-primary">
            {{ submit_button_label }}
        </button>
    </div>
</div>

{% if retry_notice %}
    <div class="alert alert-info mb-6">{{ retry_notice }}</div>
{% endif %}

<div id="form-container">
    <form id="emission-form"
          hx-post="{{ request.path }}?step={{ current_step }}"
          hx-target="#step-container"
          hx-swap="innerHTML">
        {% csrf_token %}
        {% crispy form %}
    </form>
</div>
