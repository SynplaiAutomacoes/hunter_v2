<div class="modal-box w-[98vw] max-w-7xl bg-base-100 p-0 overflow-hidden">
    <div class="p-6 border-b border-base-200 flex items-center justify-between gap-4 bg-base-50">
        <div>
            <h3 class="font-bold text-xl text-base-content">{{ title }}</h3>
            {% if description %}
                <p class="text-sm text-base-content/70 mt-1">{{ description }}</p>
            {% endif %}
        </div>
        <button type="button" class="btn btn-sm btn-circle btn-ghost" onclick="window.closeEmissionModal && window.closeEmissionModal()" aria-label="Fechar">✕</button>
    </div>

    <div class="p-6 space-y-6 max-h-[78vh] overflow-y-auto">
        {% for preview in previews %}
            <section class="rounded-2xl border border-base-300 bg-base-100 shadow-sm overflow-hidden">
                <div class="px-4 py-3 border-b border-base-200 flex items-center justify-between gap-4 bg-base-200/50">
                    <div>
                        <h4 class="font-semibold text-base-content">{{ preview.label }}</h4>
                        <p class="text-xs text-base-content/60">Alguns dados apresentados podem não refletir a realidade.</p>
                    </div>
                    <a href="{{ preview.embed_url }}" target="_blank" rel="noopener noreferrer" class="btn btn-sm btn-outline">Abrir em nova aba</a>
                </div>
                <div class="bg-base-300/20 p-3">
                    <iframe
                        src="{{ preview.embed_url }}"
                        title="{{ preview.label }}"
                        class="w-full h-[76vh] rounded-xl border border-base-300 bg-white"
                    ></iframe>
                </div>
            </section>
        {% endfor %}
    </div>

    <form
        hx-post="{{ transmit_url }}"
        hx-target="#step-container"
        hx-swap="innerHTML"
        class="p-6 border-t border-base-200 flex items-center justify-end gap-3 bg-base-50"
        data-preview-transmit-form
    >
        {% csrf_token %}
        <input type="hidden" name="intent" value="transmit">
        {% for hidden_field in hidden_fields %}
            <input type="hidden" name="{{ hidden_field.name }}" value="{{ hidden_field.value }}">
        {% endfor %}
        <button type="button" class="btn btn-ghost" onclick="window.closeEmissionModal && window.closeEmissionModal()" data-preview-cancel-button>Cancelar</button>
        <button type="submit" class="btn btn-primary min-w-32" data-preview-submit-button>
            <span class="loading loading-spinner loading-sm hidden" data-preview-submit-spinner></span>
            <span data-preview-submit-label>Transmitir</span>
        </button>
    </form>
</div>

<script>
    (function () {
        const form = document.querySelector('[data-preview-transmit-form]');
        if (!form) {
            return;
        }

        const submitButton = form.querySelector('[data-preview-submit-button]');
        const cancelButton = form.querySelector('[data-preview-cancel-button]');
        const spinner = form.querySelector('[data-preview-submit-spinner]');
        const label = form.querySelector('[data-preview-submit-label]');

        const setLoadingState = function (isLoading) {
            if (submitButton) {
                submitButton.disabled = isLoading;
            }
            if (cancelButton) {
                cancelButton.disabled = isLoading;
            }
            if (spinner) {
                spinner.classList.toggle('hidden', !isLoading);
            }
            if (label) {
                label.textContent = isLoading ? 'Transmitindo...' : 'Transmitir';
            }
        };

        form.addEventListener('submit', function () {
            setLoadingState(true);
        });

        document.body.addEventListener('htmx:responseError', function (event) {
            if (event.detail && event.detail.elt === form) {
                setLoadingState(false);
            }
        });

        document.body.addEventListener('htmx:sendError', function (event) {
            if (event.detail && event.detail.elt === form) {
                setLoadingState(false);
            }
        });
    })();
</script>
