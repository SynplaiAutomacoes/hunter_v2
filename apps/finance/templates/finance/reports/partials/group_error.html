<div class="px-8 pt-8 pb-6 bg-base-100 rounded-t-3xl border-b border-base-200">
    <div class="flex justify-between items-center mb-6">
        <div>
            <h3 class="text-2xl font-black text-base-content tracking-tight">Erro no Agrupamento</h3>
        </div>
        <button type="button" class="btn btn-circle btn-ghost btn-sm" onclick="group_modal.close()">
            <span class="material-icons">close</span>
        </button>
    </div>
</div>
<div class="p-8 bg-base-50 flex flex-col items-center text-center gap-4">
    <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-error/10 text-error mb-2">
        <span class="material-icons text-3xl">error_outline</span>
    </div>
    <h4 class="text-lg font-semibold text-base-content">Não é possível agrupar os lançamentos selecionados</h4>
    <p class="text-base-content/70 max-w-sm mx-auto">{{ error }}</p>
    <div class="mt-4 w-full flex justify-end">
        <button type="button" class="btn btn-secondary px-8" onclick="group_modal.close()">
            Fechar
        </button>
    </div>
</div>
