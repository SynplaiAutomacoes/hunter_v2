{% load crispy_forms_tags l10n %}
<div class="px-6 pt-6 pb-5 bg-base-100 rounded-t-3xl border-b border-base-200">
    <div class="flex justify-between items-start gap-4">
        <div>
            <h3 class="text-xl font-black text-base-content tracking-tight">Agrupar Lançamentos</h3>
            <p class="text-sm font-medium text-base-content/60 mt-1">Consolidar os lançamentos de <strong>{{ entity_name }}</strong>.</p>
        </div>
        <button type="button" class="btn btn-circle btn-ghost btn-sm" onclick="group_modal.close()">
            <span class="material-icons">close</span>
        </button>
    </div>
</div>

<form hx-post="{% url 'finance:group_movement_wizard' %}" hx-target="#group-modal-content">
    <input type="hidden" name="step" value="3">
    <input type="hidden" name="entity_type" value="{{ entity_type }}">
    <input type="hidden" name="entity_id" value="{{ entity_id|unlocalize }}">
    {% for mv_id in movement_ids %}
    <input type="hidden" name="movements" value="{{ mv_id|unlocalize }}">
    {% endfor %}

    <div class="p-5 bg-base-50">
        <div class="max-w-3xl mx-auto flex flex-col gap-4">
            <div class="bg-gradient-to-r from-primary to-primary/80 text-primary-content p-4 rounded-2xl shadow-md flex items-center justify-between">
                <div>
                    <h4 class="text-sm font-medium opacity-80 uppercase tracking-wide">Total a ser agrupado</h4>
                    <p class="text-sm opacity-90 mt-1">{{ movement_ids|length }} lançamento(s) selecionado(s)</p>
                </div>
                <div class="text-right">
                    <span class="text-2xl font-black tracking-tight">R$ {{ total_amount|floatformat:2 }}</span>
                </div>
            </div>
            
            <div class="bg-base-100 p-4 rounded-2xl shadow-sm border border-base-200">
                {{ form|crispy }}
            </div>
        </div>
    </div>
    
    <div class="px-6 py-4 bg-base-200/50 rounded-b-3xl border-t border-base-200 flex justify-between items-center">
        <button type="button" class="btn btn-ghost text-base-content/70 hover:bg-base-300/50" onclick="group_modal.close()">
            Cancelar
        </button>
        <button type="submit" class="btn btn-primary px-8 shadow-sm group">
            <span class="material-icons text-sm mr-2">check_circle</span>
            Finalizar Agrupamento
        </button>
    </div>
</form>
