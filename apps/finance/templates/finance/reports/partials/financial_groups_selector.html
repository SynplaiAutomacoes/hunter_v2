<div
    id="reports-financial-groups-selector"
    class="space-y-3"
    x-data="{
        all: false,
        hierarchicalSelection: true,
        getRowCheckboxes() {
            return Array.from($el.querySelectorAll('input.row-checkbox[data-row-id]'))
        },
        getUniqueRowIds() {
            return [...new Set(this.getRowCheckboxes().map((checkbox) => checkbox.dataset.rowId).filter(Boolean))]
        },
        getCheckboxesForRow(rowId) {
            return this.getRowCheckboxes().filter((checkbox) => checkbox.dataset.rowId === String(rowId))
        },
        getFirstCheckboxForRow(rowId) {
            return this.getCheckboxesForRow(rowId)[0] || null
        },
        setRowChecked(rowId, checked) {
            this.getCheckboxesForRow(rowId).forEach((checkbox) => {
                checkbox.checked = checked
            })
        },
        isRowChecked(rowId) {
            return this.getCheckboxesForRow(rowId).some((checkbox) => checkbox.checked)
        },
        getDirectChildIds(parentId) {
            return [...new Set(this.getRowCheckboxes().filter((checkbox) => (checkbox.dataset.parentId || '') === String(parentId)).map((checkbox) => checkbox.dataset.rowId).filter(Boolean))]
        },
        getDescendantIds(parentId) {
            const descendants = []
            const pendingIds = [...this.getDirectChildIds(parentId)]
            const visited = new Set()

            while (pendingIds.length > 0) {
                const currentId = pendingIds.shift()
                if (!currentId || visited.has(currentId)) {
                    continue
                }

                visited.add(currentId)
                descendants.push(currentId)
                pendingIds.push(...this.getDirectChildIds(currentId))
            }

            return descendants
        },
        getParentId(rowId) {
            const checkbox = this.getFirstCheckboxForRow(rowId)
            return checkbox ? (checkbox.dataset.parentId || '') : ''
        },
        updateAncestorState(rowId) {
            let parentId = this.getParentId(rowId)

            while (parentId) {
                const childIds = this.getDirectChildIds(parentId)
                const shouldCheckParent = childIds.length > 0 && childIds.every((childId) => this.isRowChecked(childId))
                this.setRowChecked(parentId, shouldCheckParent)
                parentId = this.getParentId(parentId)
            }
        },
        syncMasterCheckbox() {
            const rowIds = this.getUniqueRowIds()
            this.all = rowIds.length > 0 && rowIds.every((rowId) => this.isRowChecked(rowId))
        },
        toggleAll() {
            this.getUniqueRowIds().forEach((rowId) => {
                this.setRowChecked(rowId, this.all)
            })
            this.syncMasterCheckbox()
        },
        handleRowCheckboxChange(event) {
            const checkbox = event.target
            const rowId = checkbox.dataset.rowId || checkbox.value
            if (!rowId) {
                this.syncMasterCheckbox()
                return
            }

            this.setRowChecked(rowId, checkbox.checked)
            this.getDescendantIds(rowId).forEach((descendantId) => {
                this.setRowChecked(descendantId, checkbox.checked)
            })
            this.updateAncestorState(rowId)
            this.syncMasterCheckbox()
        }
    }"
    x-init="syncMasterCheckbox()"
>
    <div class="flex items-center justify-between gap-3 rounded-lg border border-base-300 bg-base-100 px-3 py-2">
        <p class="text-sm font-medium text-base-content">Selecionar grupos em cascata</p>
        <label class="label cursor-pointer gap-3 py-0">
            <span class="label-text text-sm text-base-content">Selecionar todos</span>
            <input type="checkbox" class="checkbox checkbox-sm" x-model="all" @change="toggleAll" aria-label="Selecionar todos os grupos financeiros" />
        </label>
    </div>

    <div class="max-h-64 space-y-2 overflow-y-auto pr-1">
        {% for financial_group in financial_group_filters %}
            <label class="flex cursor-pointer items-center gap-3 rounded-lg px-3 py-2 transition hover:bg-base-100/70">
                <input
                    type="checkbox"
                    class="checkbox checkbox-sm row-checkbox"
                    name="financial_groups"
                    value="{{ financial_group.pk }}"
                    data-row-id="{{ financial_group.pk }}"
                    {% if financial_group.parent_pk %}data-parent-id="{{ financial_group.parent_pk }}"{% endif %}
                    {% if financial_group.is_selected %}checked{% endif %}
                    @change="handleRowCheckboxChange($event)"
                    aria-label="Selecionar grupo financeiro"
                />
                <span class="text-sm text-base-content">{{ financial_group.label }}</span>
            </label>
        {% empty %}
            <p class="text-sm text-base-content/60">Nenhum grupo financeiro cadastrado.</p>
        {% endfor %}
    </div>
</div>
