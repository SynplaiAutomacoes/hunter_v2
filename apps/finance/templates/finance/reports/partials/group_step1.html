{% load crispy_forms_tags %}
<div class="modal-header">
    <h3 class="text-2xl font-bold">Agrupar Lançamentos - Etapa 1</h3>
    <p class="text-sm opacity-60">Selecione o fornecedor ou colaborador para agrupar.</p>
</div>

<form hx-post="{% url 'finance:group_movement_wizard' %}" hx-target="#group-modal-content">
    <input type="hidden" name="step" value="1">
    <div class="modal-body py-6">
        {{ form|crispy }}
    </div>
    <div class="modal-footer flex justify-end gap-2">
        <button type="button" class="btn btn-ghost" onclick="group_modal.close()">Cancelar</button>
        <button type="submit" class="btn btn-primary">Próximo</button>
    </div>
</form>
