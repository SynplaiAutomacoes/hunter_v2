{% load crispy_forms_tags %}
<div class="px-8 pt-8 pb-6 bg-base-100 rounded-t-3xl border-b border-base-200">
    <div class="flex justify-between items-center mb-6">
        <div>
            <h3 class="text-2xl font-black text-base-content tracking-tight">Agrupar Lançamentos</h3>
            <p class="text-sm font-medium text-base-content/60 mt-1">Siga as etapas para criar um novo agrupamento.</p>
        </div>
        <button type="button" class="btn btn-circle btn-ghost btn-sm" onclick="group_modal.close()">
            <span class="material-icons">close</span>
        </button>
    </div>
    
    <ul class="steps steps-vertical lg:steps-horizontal w-full">
      <li class="step step-primary font-medium text-sm">Entidade</li>
      <li class="step text-sm opacity-50">Lançamentos</li>
      <li class="step text-sm opacity-50">Finalizar</li>
    </ul>
</div>

<form hx-post="{% url 'finance:group_movement_wizard' %}" hx-target="#group-modal-content">
    <input type="hidden" name="step" value="1">
    
    <div class="p-8 bg-base-50">
        <div class="max-w-xl mx-auto">
            <div class="mb-4">
                <span class="material-icons text-primary text-4xl mb-2">person_search</span>
                <h4 class="text-lg font-bold text-base-content mb-1">Selecione o alvo</h4>
                <p class="text-sm text-base-content/70">Escolha um fornecedor ou colaborador para visualizar seus lançamentos pendentes.</p>
            </div>
            <div class="bg-base-100 p-6 rounded-2xl shadow-sm border border-base-200">
                {{ form|crispy }}
            </div>
        </div>
    </div>
    
    <div class="px-8 py-5 bg-base-200/50 rounded-b-3xl border-t border-base-200 flex justify-between items-center">
        <button type="button" class="btn btn-ghost text-base-content/70 hover:bg-base-300/50" onclick="group_modal.close()">Cancelar</button>
        <button type="submit" class="btn btn-primary px-8 shadow-sm group">
            Próximo Passo
            <span class="material-icons text-sm transition-transform group-hover:translate-x-1">arrow_forward</span>
        </button>
    </div>
</form>
