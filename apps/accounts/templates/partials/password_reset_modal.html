<dialog id="password-reset-modal" class="modal modal-bottom sm:modal-middle">
  <div class="modal-box w-11/12 max-w-md">
    <form id="password-reset-form">
      {% csrf_token %}

      <div class="flex justify-between items-center mb-4">
        <h3 class="font-bold text-xl">Recuperar Senha</h3>
        <button type="button" class="btn btn-sm btn-ghost btn-circle" onclick="closePasswordResetModal()">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <div class="space-y-4" id="password-reset-content">
        <div class="text-sm opacity-70 mb-4">
          Siga as etapas para recuperar sua senha.
        </div>

        <div class="flex justify-between mb-6">
          <div class="flex flex-col items-center" id="step-indicator-1">
            <div class="w-8 h-8 rounded-full bg-primary text-primary-content flex items-center justify-center font-bold text-sm" data-step="1">1</div>
            <span class="text-xs mt-1">Identificar</span>
          </div>
          <div class="flex-1 h-1 bg-base-300 mx-2 mt-4">
            <div class="h-full bg-primary transition-all duration-300" id="progress-1-2" style="width: 0%"></div>
          </div>
          <div class="flex flex-col items-center" id="step-indicator-2">
            <div class="w-8 h-8 rounded-full bg-base-300 text-base-content flex items-center justify-center font-bold text-sm" data-step="2">2</div>
            <span class="text-xs mt-1">Código</span>
          </div>
          <div class="flex-1 h-1 bg-base-300 mx-2 mt-4">
            <div class="h-full bg-primary transition-all duration-300" id="progress-2-3" style="width: 0%"></div>
          </div>
          <div class="flex flex-col items-center" id="step-indicator-3">
            <div class="w-8 h-8 rounded-full bg-base-300 text-base-content flex items-center justify-center font-bold text-sm" data-step="3">3</div>
            <span class="text-xs mt-1">Nova Senha</span>
          </div>
        </div>

        <div id="step-1" class="step-content">
          <div class="form-control">
            <label class="label">
              <span class="label-text">Usuário, e-mail ou número de WhatsApp</span>
            </label>
            <input type="text" name="identifier" id="input-identifier" class="input input-bordered w-full" placeholder="Digite seu usuário, e-mail ou WhatsApp" required>
            <div class="mt-1 w-full" id="step-1-error-label">
            </div>
          </div>
          <div class="modal-action">
            <button type="button" class="btn btn-ghost" onclick="closePasswordResetModal()">Cancelar</button>
            <button type="button" class="btn btn-primary" onclick="submitStep1()">Continuar</button>
          </div>
        </div>

        <div id="step-2" class="step-content hidden">
          <div class="text-center mb-4">
            <p class="text-sm opacity-70">Enviamos um código para seu <span id="reset-method-label" class="font-semibold"></span></p>
            <p class="font-semibold" id="masked-destination"></p>
          </div>
          <div class="form-control">
            <label class="label">
              <span class="label-text">Código de 6 dígitos</span>
            </label>
            <input type="text" name="code" id="input-code" class="input input-bordered w-full text-center tracking-widest text-2xl font-mono uppercase" placeholder="XXXXXX" maxlength="6" required>
            <div class="mt-1 w-full" id="step-2-error-label">
            </div>
          </div>
          <div class="flex justify-between items-center mt-2">
            <button type="button" class="btn btn-ghost btn-sm" onclick="resendCode()">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
              </svg>
              Reenviar
            </button>
          </div>
          <div class="modal-action">
            <button type="button" class="btn btn-ghost" onclick="goToStep(1)">Voltar</button>
            <button type="button" class="btn btn-primary" onclick="submitStep2()">Verificar</button>
          </div>
        </div>

        <div id="step-3" class="step-content hidden">
          <div class="form-control">
            <label class="label">
              <span class="label-text">Nova Senha</span>
            </label>
            <input type="password" name="new_password1" id="input-password1" class="input input-bordered w-full" placeholder="Mínimo 8 caracteres" required>
          </div>
          <div class="form-control mt-3">
            <label class="label">
              <span class="label-text">Confirmar Senha</span>
            </label>
            <input type="password" name="new_password2" id="input-password2" class="input input-bordered w-full" placeholder="Digite novamente" required>
            <div class="mt-1 w-full" id="step-3-error-label">
            </div>
          </div>
          <div class="modal-action">
            <button type="button" class="btn btn-ghost" onclick="goToStep(2)">Voltar</button>
            <button type="button" class="btn btn-primary" onclick="submitStep3()">Alterar Senha</button>
          </div>
        </div>

        <div id="step-4" class="step-content hidden text-center py-8">
          <div class="text-success mb-4">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 mx-auto" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
          </div>
          <h4 class="font-bold text-xl mb-2">Senha alterada!</h4>
          <p class="text-sm opacity-70 mb-6">Sua senha foi redefinida com sucesso.</p>
          <button type="button" class="btn btn-primary" onclick="closePasswordResetModal(true)">Fechar</button>
        </div>
      </div>
    </form>
  </div>
  <form method="dialog" class="modal-backdrop">
    <button>close</button>
  </form>
</dialog>

<script>
let currentStep = 1;

function getCookie(name) {
  let cookieValue = null;
  if (document.cookie && document.cookie !== '') {
    const cookies = document.cookie.split(';');
    for (let i = 0; i < cookies.length; i++) {
      const cookie = cookies[i].trim();
      if (cookie.substring(0, name.length + 1) === (name + '=')) {
        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
        break;
      }
    }
  }
  return cookieValue;
}

function openPasswordResetModal() {
  console.log('[PasswordReset] Opening modal');
  document.getElementById('password-reset-modal').showModal();
  resetWizard();
}

function closePasswordResetModal(reload = false) {
  console.log('[PasswordReset] Closing modal, reload:', reload);
  document.getElementById('password-reset-modal').close();
  if (reload) {
    window.location.reload();
  }
}

function resetWizard() {
  currentStep = 1;
  document.querySelectorAll('.step-content').forEach(el => el.classList.add('hidden'));
  document.getElementById('step-1').classList.remove('hidden');
  document.querySelectorAll('[id^="progress-"]').forEach(el => el.style.width = '0%');
  updateStepIndicators(1);
  document.getElementById('input-identifier').value = '';
  document.getElementById('input-code').value = '';
  document.getElementById('input-password1').value = '';
  document.getElementById('input-password2').value = '';
  clearErrors();
}

function updateStepIndicators(step) {
  for (let i = 1; i <= 3; i++) {
    const indicator = document.querySelector(`[data-step="${i}"]`);
    if (i < step) {
      indicator.classList.remove('bg-base-300', 'text-base-content');
      indicator.classList.add('bg-success', 'text-success-content');
      indicator.innerHTML = '✓';
    } else if (i === step) {
      indicator.classList.remove('bg-base-300', 'text-base-content', 'bg-success', 'text-success-content');
      indicator.classList.add('bg-primary', 'text-primary-content');
      indicator.innerHTML = i;
    } else {
      indicator.classList.remove('bg-primary', 'text-primary-content', 'bg-success', 'text-success-content');
      indicator.classList.add('bg-base-300', 'text-base-content');
      indicator.innerHTML = i;
    }
  }

  if (step > 1) {
    document.getElementById('progress-1-2').style.width = '100%';
  }
  if (step > 2) {
    document.getElementById('progress-2-3').style.width = '100%';
  }
}

function goToStep(step) {
  console.log('[PasswordReset] Going to step:', step);
  currentStep = step;
  document.querySelectorAll('.step-content').forEach(el => el.classList.add('hidden'));
  document.getElementById(`step-${step}`).classList.remove('hidden');
  updateStepIndicators(step);
}

function clearErrors() {
  document.querySelectorAll('[id$="-error-label"]').forEach(el => el.innerHTML = '');
}

function showError(step, message) {
  console.error('[PasswordReset] Error at step', step, ':', message);
  const errorLabel = document.getElementById(`step-${step}-error-label`);
  if (errorLabel) {
    errorLabel.innerHTML = `<span class="label-text-alt text-error block break-words whitespace-normal">${message}</span>`;
  }
}

function setResetDestination(method, destination) {
  const methodLabel = method === 'email' ? 'e-mail' : 'WhatsApp';
  document.getElementById('reset-method-label').textContent = methodLabel;
  document.getElementById('masked-destination').textContent = destination || '';
}

function submitStep1() {
  const identifier = document.getElementById('input-identifier').value.trim();
  console.log('[PasswordReset] Submit step 1, identifier:', identifier);

  if (!identifier) {
    showError(1, 'Informe seu usuário ou e-mail.');
    return;
  }

  const formData = new URLSearchParams();
  formData.append('step', '1');
  formData.append('identifier', identifier);

  const csrfToken = getCookie('csrftoken') || '{{ csrf_token }}';
  console.log('[PasswordReset] CSRF Token:', csrfToken);

  fetch('{% url "accounts:password_reset" %}', {
    method: 'POST',
    headers: {
      'X-CSRFToken': csrfToken,
      'Content-Type': 'application/x-www-form-urlencoded',
    },
    body: formData.toString(),
  })
  .then(response => {
    console.log('[PasswordReset] Response status:', response.status);
    return response.json();
  })
  .then(data => {
    console.log('[PasswordReset] Response data:', data);
    if (data.success) {
      setResetDestination(data.method, data.destination);
      goToStep(2);
      showToast('Código enviado com sucesso!', 'success');
    } else {
      const errorMsg = data.error || (data.errors && data.errors.identifier ? data.errors.identifier[0] : 'Erro desconhecido');
      showError(1, errorMsg);
    }
  })
  .catch(err => {
    console.error('[PasswordReset] Error:', err);
    showError(1, 'Erro de comunicação. Tente novamente.');
  });
}

function submitStep2() {
  const code = document.getElementById('input-code').value.trim().toUpperCase();
  console.log('[PasswordReset] Submit step 2, code:', code);

  if (!code || code.length !== 6) {
    showError(2, 'Informe o código de 6 dígitos.');
    return;
  }

  const formData = new URLSearchParams();
  formData.append('step', '2');
  formData.append('code', code);

  const csrfToken = getCookie('csrftoken') || '{{ csrf_token }}';

  fetch('{% url "accounts:password_reset" %}', {
    method: 'POST',
    headers: {
      'X-CSRFToken': csrfToken,
      'Content-Type': 'application/x-www-form-urlencoded',
    },
    body: formData.toString(),
  })
  .then(response => response.json())
  .then(data => {
    console.log('[PasswordReset] Response data:', data);
    if (data.success) {
      goToStep(3);
      showToast('Código validado!', 'success');
    } else {
      const errorMsg = data.error || (data.errors && data.errors.code ? data.errors.code[0] : 'Erro desconhecido');
      showError(2, errorMsg);
    }
  })
  .catch(err => {
    console.error('[PasswordReset] Error:', err);
    showError(2, 'Erro de comunicação. Tente novamente.');
  });
}

function submitStep3() {
  const password1 = document.getElementById('input-password1').value;
  const password2 = document.getElementById('input-password2').value;
  console.log('[PasswordReset] Submit step 3');

  if (!password1 || password1.length < 8) {
    showError(3, 'A senha deve ter pelo menos 8 caracteres.');
    return;
  }

  if (password1 !== password2) {
    showError(3, 'As senhas não conferem.');
    return;
  }

  const formData = new URLSearchParams();
  formData.append('step', '3');
  formData.append('new_password1', password1);
  formData.append('new_password2', password2);

  const csrfToken = getCookie('csrftoken') || '{{ csrf_token }}';

  fetch('{% url "accounts:password_reset" %}', {
    method: 'POST',
    headers: {
      'X-CSRFToken': csrfToken,
      'Content-Type': 'application/x-www-form-urlencoded',
    },
    body: formData.toString(),
  })
  .then(response => response.json())
  .then(data => {
    console.log('[PasswordReset] Response data:', data);
    if (data.success) {
      goToStep(4);
      showToast('Senha alterada com sucesso!', 'success');
    } else {
      const errors = data.errors || {};
      const errorMsg = data.error || errors.new_password1?.[0] || errors.new_password2?.[0] || 'Erro desconhecido';
      showError(3, errorMsg);
    }
  })
  .catch(err => {
    console.error('[PasswordReset] Error:', err);
    showError(3, 'Erro de comunicação. Tente novamente.');
  });
}

function resendCode() {
  console.log('[PasswordReset] Resend code requested');
  const csrfToken = getCookie('csrftoken') || '{{ csrf_token }}';

  fetch('{% url "accounts:password_reset_resend" %}', {
    method: 'POST',
    headers: {
      'X-CSRFToken': csrfToken,
      'Content-Type': 'application/x-www-form-urlencoded',
    },
  })
  .then(response => response.json())
  .then(data => {
    console.log('[PasswordReset] Resend response:', data);
    if (data.success) {
      setResetDestination(data.method, data.destination);
      showToast('Novo código enviado!', 'success');
    } else {
      showError(2, data.error || 'Erro ao reenviar código.');
    }
  })
  .catch(err => {
    console.error('[PasswordReset] Resend error:', err);
    showError(2, 'Erro de conexão.');
  });
}

function showToast(message, type = 'info') {
  const toast = document.createElement('div');
  toast.className = `alert alert-${type} fixed bottom-4 right-4 z-50 shadow-lg`;
  toast.innerHTML = `<span>${message}</span>`;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 3000);
}
</script>
