<div class="modal-box wo-item-modal-box w-11/12 max-w-4xl bg-base-100 p-0 overflow-hidden">
    <div class="p-6 border-b border-base-200 flex justify-between items-center bg-base-50">
        <h3 class="font-bold text-xl flex items-center gap-2">
            <span class="material-icons text-primary">edit</span>
            Editar Item da O.S.
        </h3>
        <button
            type="button"
            class="btn btn-sm btn-circle btn-ghost"
            onclick="window.closeWorkorderItemModal && window.closeWorkorderItemModal()">✕</button>
    </div>

    <form
        hx-post="{% url 'workorder:edit_item' workorder.pk item.pk %}?tab={{ active_tab }}"
        hx-target="#item-modal-container"
        hx-swap="innerHTML"
        class="p-6 space-y-4">
        {% csrf_token %}
        <input type="hidden" name="active_tab" value="{{ active_tab }}">

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            {% include "workorder/partials/modals/modal_edit_item_form.html" %}
        </div>

        <div class="pt-4 border-t border-base-200 flex justify-end gap-2">
            <button
                type="button"
                class="btn btn-ghost"
                onclick="window.closeWorkorderItemModal && window.closeWorkorderItemModal()">Cancelar</button>
            <button type="submit" class="btn btn-primary">Salvar</button>
        </div>
    </form>
</div>
