<div class="card-body">
    <h3 class="font-bold text-2xl pb-2 mb-4">Aprovação do Serviço Executado e Retirada do Veículo</h3>

    <div class="mt-6 pt-4 border-t border-base-300">
        <h4 class="font-bold text-xl mb-2 border-b">PDF</h4>

        <div class="flex flex-wrap gap-3">
            <div class="flex flex-wrap gap-3">
                <button type="button" class="btn btn-primary"
                    onclick="window.dispatchEvent(new CustomEvent('open-pdf-modal', {
                        detail: {
                            url: '{% url 'workorder:visualizar_pdf' workorder.pk %}',
                            showSignatureBtn: true
                        }
                    }))">
                    <span class="material-icons mr-2">visibility</span>
                    Visualizar PDF
                </button>
            </div>
        </div>
    </div>

    <div class="mt-6 pt-4 border-t border-base-300">
        <h4 class="font-bold text-xl mb-2 border-b">Atualizar Status da Ordem de Serviço</h4>

        <div class="flex flex-wrap gap-3">
            <form
                method="post"
                hx-post="{% url 'workorder:update_status' workorder.pk 'cancel' %}"
                hx-target="#customer-approvement-section"
                hx-swap="innerHTML">
                {% csrf_token %}
                <button type="submit" class="btn btn-error" {% if workorder.status == 'cancelled' %}disabled{% endif %}>Cancelar</button>
            </form>

            <form
                method="post"
                hx-post="{% url 'workorder:update_status' workorder.pk 'approve' %}"
                hx-target="#customer-approvement-section"
                hx-swap="innerHTML">
                {% csrf_token %}
                <button type="submit" class="btn btn-success" {% if workorder.status == 'approved' %}disabled{% endif %}>Aprovar</button>
            </form>

            <form
                method="post"
                hx-post="{% url 'workorder:update_status' workorder.pk 'reject' %}"
                hx-target="#customer-approvement-section"
                hx-swap="innerHTML">
                {% csrf_token %}
                <button type="submit" class="btn btn-warning" {% if workorder.status == 'rejected' %}disabled{% endif %}>Rejeitar</button>
            </form>
        </div>
    </div>
</div>
