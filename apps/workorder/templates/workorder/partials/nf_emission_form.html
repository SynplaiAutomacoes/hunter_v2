{% load crispy_forms_tags %}
<form id="workorder-emission-form"
      method="post"
      hx-post="{% url 'workorder:emission_continue' workorder.pk %}"
      hx-target="#nf-section"
      hx-swap="innerHTML"
      data-allow-locked="1">
    {% csrf_token %}
    {% crispy emission_form %}
    <div class="flex justify-end mt-6">
        <button type="submit" class="btn btn-primary" data-allow-locked="1">
            Continuar para configuração
        </button>
    </div>
</form>
