<div id="workorder-history">
    {% if workorder_history %}
    <div class="mt-4 rounded-xl border border-base-300 bg-base-200/40 p-4">
        <h5 class="text-lg font-semibold text-base-content">Histórico da OS</h5>
        <div class="mt-3 space-y-3">
            {% for history_entry in workorder_history %}
                <div class="rounded-lg border border-base-300 bg-base-100 p-3">
                    <p class="text-sm font-medium text-base-content">{{ history_entry.criado_em|date:"d/m/Y H:i" }} - {{ history_entry.get_action_display }}</p>
                    <p class="mt-1 whitespace-pre-line text-sm text-base-content/80">{{ history_entry.reason }}</p>
                </div>
            {% endfor %}
        </div>
    </div>
    {% endif %}
</div>
