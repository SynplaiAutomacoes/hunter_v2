<div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
    <div>
        <label for="{{ table_id }}-filter-client">Cliente</label>
        <input
            type="text"
            name="client"
            id="{{ table_id }}-filter-client"
            value="{{ request.GET.client|default:'' }}"
            placeholder="Digite o cliente"
            class="input-theme"
        />
    </div>

    <div>
        <label for="{{ table_id }}-filter-vehicle">Veiculo</label>
        <input
            type="text"
            name="vehicle"
            id="{{ table_id }}-filter-vehicle"
            value="{{ request.GET.vehicle|default:'' }}"
            placeholder="Digite a placa"
            class="input-theme"
        />
    </div>

    <div>
        <label for="{{ table_id }}-filter-data-inicial">Data inicial</label>
        <input
            type="date"
            name="data_inicial"
            id="{{ table_id }}-filter-data-inicial"
            value="{{ request.GET.data_inicial|default:'' }}"
            class="input-theme"
        />
    </div>

    <div>
        <label for="{{ table_id }}-filter-data-final">Data final</label>
        <input
            type="date"
            name="data_final"
            id="{{ table_id }}-filter-data-final"
            value="{{ request.GET.data_final|default:'' }}"
            class="input-theme"
        />
    </div>

    <fieldset class="sm:col-span-2">
        <legend class="label-text font-medium">Status</legend>
        <div class="mt-2 grid gap-2 rounded-box border border-base-300 bg-base-100 p-3 sm:grid-cols-2">
            {% for value, label in status_choices %}
                <label class="flex cursor-pointer select-none items-center gap-3 rounded-md px-2 py-1 hover:bg-base-200/70">
                    <input type="checkbox" name="status" value="{{ value }}" class="checkbox checkbox-sm" {% if value in selected_status_values %}checked{% endif %} />
                    <span class="text-sm text-base-content">{{ label }}</span>
                </label>
            {% endfor %}
        </div>
    </fieldset>

    <div class="sm:col-span-2">
        <label class="flex cursor-pointer select-none items-center gap-3 rounded-box border border-base-300 bg-base-100 p-3 hover:bg-base-200/70">
            <input type="checkbox" name="reopened" value="1" class="checkbox checkbox-sm" {% if selected_reopened %}checked{% endif %} />
            <span class="text-sm text-base-content">O.S. reabertas</span>
        </label>
    </div>

    <fieldset class="sm:col-span-2">
        <legend class="label-text font-medium">Tipo</legend>
        <div class="mt-2 grid gap-2 rounded-box border border-base-300 bg-base-100 p-3 sm:grid-cols-3">
            {% for value, label in budget_type_choices %}
                <label class="flex cursor-pointer select-none items-center gap-3 rounded-md px-2 py-1 hover:bg-base-200/70">
                    <input type="checkbox" name="budget_type" value="{{ value }}" class="checkbox checkbox-sm" {% if value in selected_budget_type_values %}checked{% endif %} />
                    <span class="text-sm text-base-content">{{ label }}</span>
                </label>
            {% endfor %}
        </div>
    </fieldset>
</div>
