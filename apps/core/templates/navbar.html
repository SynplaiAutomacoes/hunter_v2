<nav x-data="{
    menus: [
        {
            label: 'Cadastros',
            items: [
                { label: 'Item 1', href: '#' },
                { label: 'Item 2', href: '#' },
                { label: 'Item 3', href: '#' }
            ]
        },
        {
            label: 'Orçamentos',
            href: '#'
        },
        {
            label: 'Estoque',
            items: [
                { label: 'Item 7', href: '#' },
                { label: 'Item 8', href: '#' },
                { label: 'Item 9', href: '#' }
            ]
        }
    ]
}">
    <div class="navbar bg-navbar shadow-sm text-base-100">
        <!-- ──── START ──── -->
        <div class="navbar-start">
            <!-- Mobile hamburger -->
            <div class="dropdown">
                <div tabindex="0" role="button" class="btn btn-ghost lg:hidden" aria-label="Abrir menu">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                </div>

                <!-- Mobile menu (dropdown clicável) -->
                <ul tabindex="0" class="dropdown-content menu menu-md bg-base-100 text-base-content rounded-box w-64 shadow">
                    <template x-for="menu in menus" :key="menu.label">
                        <li>
                            <template x-if="menu.items" class="hidden">
                                <details x-data="{ open: false }" @toggle="open = $el.open">
                                    <summary class="flex items-center justify-between gap-2">
                                        <span x-text="menu.label"></span>
                                    </summary>
                                    <ul>
                                        <template x-for="item in menu.items" :key="item.label">
                                            <li><a :href="item.href" x-text="item.label"></a></li>
                                        </template>
                                    </ul>
                                </details>
                            </template>

                            <template x-if="!menu.items" class="hidden">
                                <a :href="menu.href" x-text="menu.label"></a>
                            </template>
                        </li>
                    </template>
                </ul>
            </div>

            <!-- Logo -->
            <a href="/" class="btn btn-ghost text-xl normal-case">Hunter</a>
        </div>

        <!-- ──── CENTER ──── -->
        <div class="navbar-center hidden lg:flex">
            <ul class="menu menu-horizontal">
                <template x-for="menu in menus" :key="menu.label">
                    <li>
                        <template x-if="menu.items" class="hidden">
                            <div class="dropdown dropdown-hover dropdown-center" x-data="{ hover: false }" @mouseenter="hover = true" @mouseleave="hover = false">
                                <div tabindex="0" role="button" class="flex items-center gap-1 text-base font-medium">
                                    <span x-text="menu.label"></span>
                                    <svg xmlns="http://www.w3.org/2000/svg"
                                         viewBox="0 0 20 20"
                                         fill="currentColor"
                                         stroke="currentColor"
                                         class="h-4 w-4 origin-center transform-gpu transition-transform duration-[250ms] ease-out motion-reduce:transition-none"
                                         :style="hover ? 'transform: rotate(180deg)' : 'transform: rotate(0deg)'">
                                        <path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 0 1 1.06.02L10 11.168l3.71-3.938a.75.75 0 1 1 1.08 1.04l-4.24 4.5a.75.75 0 0 1-1.08 0l-4.24-4.5a.75.75 0 0 1 .02-1.06Z" clip-rule="evenodd"></path>
                                    </svg>
                                </div>
                                <ul tabindex="-1" class="dropdown-content menu bg-base-100 text-base-content rounded-box z-1 mt-1 w-52 p-2 shadow">
                                    <template x-for="item in menu.items" :key="item.label">
                                        <li><a :href="item.href" x-text="item.label"></a></li>
                                    </template>
                                </ul>
                            </div>
                        </template>

                        <template x-if="!menu.items" class="hidden">
                            <a class="text-base font-medium" :href="menu.href" x-text="menu.label"></a>
                        </template>
                    </li>
                </template>
            </ul>
        </div>

        <!-- ──── END ──── -->
        <div class="navbar-end gap-2">
            <select class="select select-sm bg-base-100 text-base-content max-w-32">
                <option selected>Opção A</option>
                <option>Opção B</option>
                <option>Opção C</option>
            </select>

            <div class="dropdown dropdown-end">
                <div tabindex="0" role="button" class="avatar hover:cursor-pointer" aria-label="Abrir menu do perfil">
                    <div class="w-9 rounded-full ring ring-base-100 ring-offset-2 ring-offset-primary">
                        <img alt="Avatar" src="https://img.daisyui.com/images/profile/demo/spiderperson@192.webp"/>
                    </div>
                </div>
                <ul tabindex="0"
                    class="dropdown-content menu menu-sm bg-base-100 text-base-content rounded-box mt-3 w-52 p-2 shadow"
                    style="z-index: 50;">
                    <li><a href="#">Perfil</a></li>
                    <li><a href="#">Configurações</a></li>
                    <li><a href="#">Sair</a></li>
                </ul>
            </div>
        </div>
    </div>
</nav>
