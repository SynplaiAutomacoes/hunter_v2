{% with raw=widget.value|default_if_none:"" %}
<div
    x-data="formatters.widget.phoneInput('{{ raw|escapejs }}')"
    x-init="init()"
>
    <input
        type="text"
        x-ref="display"
        @input="handleInput"
        inputmode="numeric"
        autocomplete="off"
        placeholder="(11) 9999-9999 ou (11) 99999-9999"
        class="input-theme {{ widget.attrs.class }}"
        {% if widget.attrs.required %}required{% endif %}
        {% if widget.attrs.disabled %}disabled{% endif %}
        {% if widget.attrs.readonly %}readonly{% endif %}
    >

    <input
        type="hidden"
        x-ref="value"
        name="{{ widget.name }}"
        id="{{ widget.attrs.id }}"
        value="{{ raw }}"
        {% if widget.attrs.disabled %}disabled{% endif %}
    >
</div>
{% endwith %}
