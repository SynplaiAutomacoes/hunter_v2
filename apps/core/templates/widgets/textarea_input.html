<div>
    <textarea
        name="{{ widget.name }}"
        id="{{ widget.attrs.id }}"
        cols="{{ widget.attrs.cols|default:'40' }}"
        rows="{{ widget.attrs.rows }}"
        placeholder="{{ widget.attrs.placeholder|default:'' }}"
        class="border-none input-theme w-full {{ widget.attrs.class }}"
        {% if widget.attrs.required %}required{% endif %}
        {% if widget.attrs.disabled %}disabled{% endif %}
        {% if widget.attrs.readonly %}readonly{% endif %}
        {% for name, value in widget.attrs.items %}
            {% if name != "id" and name != "placeholder" and name != "required" and name != "disabled" and name != "readonly" and name != "class" and name != "rows" and name != "cols" %}
                {% if value is True %}{{ name }}{% elif value is False or value is None %}{% else %}{{ name }}="{{ value|escape }}"{% endif %}
            {% endif %}
        {% endfor %}
    >{{ widget.value|default_if_none:'' }}</textarea>
</div>
