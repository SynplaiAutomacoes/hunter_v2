{% load l10n %}

{% with amount=widget.subwidgets.0 currency=widget.subwidgets.1 %}
<div
    x-data="formatters.widget.moneyInput('{{ amount.value|default_if_none:""|unlocalize|escapejs }}')"
    x-init="init()"
    class="relative"
>
    <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3">
        <span class="sm:text-sm">R$</span>
    </div>

    <!-- input visível (apenas UI) -->
    <input
        type="text"
        id="{{ amount.attrs.id }}_display"
        x-ref="display"
        @input="handleInput"
        inputmode="numeric"
        autocomplete="off"
        placeholder="0,00"
        class="input-theme pl-8 pr-2 {{ widget.attrs.class }}"
        {% if widget.attrs.required %}required{% endif %}
        {% if widget.attrs.disabled %}disabled{% endif %}
        {% if widget.attrs.readonly %}readonly{% endif %}

        {% for name, value in widget.attrs.items %}
            {% if name != 'class' and name != 'type' and name != 'name' and name != 'id' and name != 'value' and name != 'x-ref' %}
                {{ name }}="{% if value is True %}{{ name }}{% else %}{{ value }}{% endif %}"
            {% endif %}
        {% endfor %}
    >

    <!-- subwidget real do valor (vai no POST) -->
    <input
        type="hidden"
        x-ref="amount"
        name="{{ amount.name }}"
        id="{{ amount.attrs.id }}"
        value="{{ amount.value|default_if_none:''|unlocalize }}"
        {% if amount.attrs.disabled %}disabled{% endif %}
    >

    <!-- subwidget real da moeda (fixo) -->
    <input
        type="hidden"
        name="{{ currency.name }}"
        id="{{ currency.attrs.id }}"
        value="BRL"
        {% if currency.attrs.disabled %}disabled{% endif %}
    >
</div>
{% endwith %}
