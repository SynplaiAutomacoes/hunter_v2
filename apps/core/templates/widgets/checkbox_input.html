<div class="py-2 flex items-center">
    <label for="{{ widget.attrs.id }}"></label><input
        type="checkbox"
        name="{{ widget.name }}"
        id="{{ widget.attrs.id }}"
        class="h-5 w-5 border-gray-300 text-blue-800"
        {% if widget.value %}checked{% endif %}
        {% if widget.attrs.required %}required{% endif %}
        {% if widget.attrs.disabled %}disabled{% endif %}
    >
</div>
