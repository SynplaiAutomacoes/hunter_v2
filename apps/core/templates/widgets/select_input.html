<div
    x-data="{
        open: false,
        value: '{{ widget.value|default_if_none:"" }}',
        label: 'Selecione...',

        init() {
            const selected = this.$refs.options.querySelector(`[data-value='${this.value}']`);
            if (selected) {
                this.value = selected.dataset.value;
                this.label = selected.dataset.label;
                return;
            }
            this.label = this.value ? this.label : 'Selecione...';
        },

        select(el) {
            this.value = el.dataset.value || '';
            this.label = el.dataset.label || 'Selecione...';
            this.open = false;
        },

        clear() {
            this.value = '';
            this.label = 'Selecione...';
            this.open = false;
        }
    }"
    x-init="init()"
    class="relative w-full"
    @click.outside="open = false"
>
    <input
        type="hidden"
        name="{{ widget.name }}"
        :value="value"
        {% if widget.attrs.required %}required{% endif %}
    >

    <button
        type="button"
        @click="open = !open"
        class="{% include 'widgets/_input_style_base.html' %} {{ widget.attrs.class }} flex w-full items-center justify-between bg-white text-left cursor-default"
        :class="{'ring-2 ring-blue-800 border-blue-800': open}"
    >
        <span x-text="label" :class="{'text-gray-500': !value, 'text-gray-900': value}"></span>
        <span class="pointer-events-none flex items-center pr-2">
            <svg class="h-5 w-5 text-gray-400 transition-transform duration-200" :class="{'rotate-180': open}" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M10 3a1 1 0 01.707.293l3 3a1 1 0 01-1.414 1.414L10 5.414 7.707 7.707a1 1 0 01-1.414-1.414l3-3A1 1 0 0110 3zm-3.707 9.293a1 1 0 011.414 0L10 14.586l2.293-2.293a1 1 0 011.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clip-rule="evenodd"></path>
            </svg>
        </span>
    </button>

    <div
        x-show="open"
        x-transition:enter="transition ease-out duration-100"
        x-transition:enter-start="transform opacity-0 scale-95"
        x-transition:enter-end="transform opacity-100 scale-100"
        x-transition:leave="transition ease-in duration-75"
        x-transition:leave-start="transform opacity-100 scale-100"
        x-transition:leave-end="transform opacity-0 scale-95"
        class="absolute z-50 mt-1 max-h-60 w-full overflow-auto rounded-md bg-white py-1 text-base shadow-lg ring-1 ring-black ring-opacity-5 focus:outline-none sm:text-sm"
        style="display: none;"
    >
        <ul role="listbox" x-ref="options">
            <li
                @click="clear()"
                class="cursor-pointer select-none py-2 pl-3 pr-9 text-gray-500 hover:bg-gray-100"
            >
                Limpar seleção
            </li>

            {% for group_name, group_choices, group_index in widget.optgroups %}
                {% if group_name %}
                    <li class="relative py-1 pl-3 pr-9 text-xs font-semibold text-gray-500 bg-gray-50">
                        {{ group_name }}
                    </li>
                {% endif %}

                {% for option in group_choices %}
                    <li
                        @click="select($el)"
                        data-value="{{ option.value }}"
                        data-label="{{ option.label|escapejs }}"
                        data-selected="{% if option.selected %}1{% else %}0{% endif %}"
                        class="text-gray-900 relative cursor-pointer select-none py-2 pl-3 pr-9 hover:bg-blue-600 hover:text-white group"
                    >
                        <span class="block truncate" :class="{'font-semibold': value === $el.dataset.value}">
                            {{ option.label }}
                        </span>

                        <span
                            x-show="value === $el.dataset.value"
                            class="absolute inset-y-0 right-0 flex items-center pr-4 text-blue-600 group-hover:text-white"
                        >
                            <svg class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"></path>
                            </svg>
                        </span>
                    </li>
                {% endfor %}
            {% endfor %}
        </ul>
    </div>
</div>
