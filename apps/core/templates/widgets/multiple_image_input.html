{% load i18n %}
<div class="flex flex-col gap-3">
    <!-- List area for selected files -->
    <div id="preview-container-{{ widget.attrs.id }}" class="space-y-2">
        <!-- Selected files will be rendered here -->
    </div>

    <!-- File input -->
    <div class="flex items-center gap-2">
        <input
            type="file"
            name="{{ widget.name }}"
            id="{{ widget.attrs.id }}"
            onchange="handleMultipleFiles(event, '{{ widget.attrs.id }}')"
            class="file-input file-input-bordered w-full"
            {% if widget.attrs.accept %}accept="{{ widget.attrs.accept }}"{% endif %}
            {% for name, value in widget.attrs.items %}
                {% if name != "id" and name != "name" and name != "accept" and name != "disabled" and name != "class" %}
                    {% if value is True %}{{ name }}{% elif value is False or value is None %}{% else %}{{ name }}="{{ value|escape }}"{% endif %}
                {% endif %}
            {% endfor %}
            multiple
            {% if widget.attrs.disabled %}disabled{% endif %}
        >
    </div>

    <p class="text-sm text-gray-500">
        Você pode adicionar múltiplos arquivos. Máximo 10MB por arquivo e 10 anexos por orçamento.
    </p>
</div>

<script>
if (typeof window.selectedUploadFiles === 'undefined') {
    window.selectedUploadFiles = {};
}

function escapeHtml(value) {
    return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

function formatFileSize(sizeInBytes) {
    const units = ['B', 'kB', 'MB', 'GB', 'TB'];
    let size = Number(sizeInBytes) || 0;
    let unitIndex = 0;

    while (size >= 1000 && unitIndex < units.length - 1) {
        size /= 1000;
        unitIndex += 1;
    }

    if (size >= 999.5 && unitIndex < units.length - 1) {
        size /= 1000;
        unitIndex += 1;
    }

    let formatted;
    if (unitIndex === 0) {
        formatted = String(Math.round(size));
    } else if (size >= 100) {
        formatted = String(Math.round(size));
    } else {
        formatted = size.toFixed(1).replace(/\.0$/, '');
    }

    return `${formatted} ${units[unitIndex]}`;
}

function renderSelectedFiles(widgetId) {
    const container = document.getElementById('preview-container-' + widgetId);
    if (!container) return;

    const files = window.selectedUploadFiles[widgetId] || [];
    container.innerHTML = '';

    files.forEach((file, index) => {
        const safeName = escapeHtml(file.name);
        const row = document.createElement('div');
        row.className = 'flex items-center justify-between gap-3 border border-base-300 rounded-lg px-3 py-2 bg-base-100';
        row.innerHTML = `
            <div class="min-w-0 flex-1">
                <p class="text-sm font-semibold truncate" title="${safeName}">${safeName}</p>
                <p class="text-xs opacity-70">${formatFileSize(file.size)}</p>
            </div>
            <button
                type="button"
                onclick="removeSelectedFile('${widgetId}', ${index})"
                class="btn btn-xs btn-error text-white"
                title="Excluir"
            >
                Excluir
            </button>
        `;
        container.appendChild(row);
    });
}

function hydrateMultipleImageInput(widgetId) {
    const input = document.getElementById(widgetId);
    if (!input) return;

    window.selectedUploadFiles[widgetId] = [];
    input.value = '';

    renderSelectedFiles(widgetId);
}

function handleMultipleFiles(event, widgetId) {
    const files = event.target.files;

    if (files.length === 0) {
        return;
    }

    if (!window.selectedUploadFiles[widgetId]) {
        window.selectedUploadFiles[widgetId] = [];
    }

    const maxFileSize = Number(event.target.dataset.maxFileSizeBytes) || (10 * 1024 * 1024);
    const maxFiles = Number(event.target.dataset.maxFiles) || 10;
    const maxFileSizeMb = Math.round((maxFileSize / 1024 / 1024) * 100) / 100;

    Array.from(files).forEach((file) => {
        if (file.size > maxFileSize) {
            alert(`Arquivo "${file.name}" excede o tamanho máximo de ${maxFileSizeMb}MB (${(file.size / 1024 / 1024).toFixed(2)}MB).`);
            return;
        }

        if (window.selectedUploadFiles[widgetId].length >= maxFiles) {
            alert(`Máximo de ${maxFiles} arquivos atingido.`);
            return;
        }

        window.selectedUploadFiles[widgetId].push(file);
    });

    renderSelectedFiles(widgetId);
    updateFileInput(widgetId);

    const autoUploadEnabled = event.target.dataset.autoUpload === 'true';
    if (autoUploadEnabled) {
        const form = event.target.closest('form');
        if (form && !form.dataset.autoUploading) {
            form.dataset.autoUploading = 'true';
            if (window.htmx && typeof window.htmx.trigger === 'function') {
                window.htmx.trigger(form, 'submit');
            } else {
                form.requestSubmit();
            }
            window.selectedUploadFiles[widgetId] = [];
            updateFileInput(widgetId);
            renderSelectedFiles(widgetId);
            window.setTimeout(() => {
                delete form.dataset.autoUploading;
            }, 500);
        }
    }
}

function removeSelectedFile(widgetId, index) {
    if (!window.selectedUploadFiles[widgetId]) return;

    window.selectedUploadFiles[widgetId].splice(index, 1);

    renderSelectedFiles(widgetId);
    updateFileInput(widgetId);
}

function updateFileInput(widgetId) {
    const input = document.getElementById(widgetId);
    if (!input) return;

    const dt = new DataTransfer();
    (window.selectedUploadFiles[widgetId] || []).forEach((file) => {
        dt.items.add(file);
    });
    input.files = dt.files;
}

hydrateMultipleImageInput('{{ widget.attrs.id }}');
</script>
