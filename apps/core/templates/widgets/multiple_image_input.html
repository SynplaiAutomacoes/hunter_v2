{% load i18n %}
<div class="flex flex-col gap-3">
    <!-- Preview area for new images -->
    <div id="preview-container-{{ widget.attrs.id }}" class="grid grid-cols-2 gap-3">
        <!-- Previews will be added here dynamically -->
    </div>

    <!-- File input -->
    <div class="flex items-center gap-2">
        <input
            type="file"
            name="{{ widget.name }}"
            id="{{ widget.attrs.id }}"
            onchange="handleMultipleImages(event, '{{ widget.attrs.id }}')"
            class="file-input file-input-bordered w-full"
            accept="image/jpeg,image/jpg,image/png,image/gif"
            multiple
            {% if widget.attrs.disabled %}disabled{% endif %}
        >
    </div>

    <p class="text-sm text-gray-500">
        Você pode adicionar múltiplas imagens separadamente. Formatos aceitos: JPG, PNG, GIF. Máximo 10MB por imagem e 10 imagens por orçamento.
    </p>
</div>

<script>
// Store selected files globally per widget
if (typeof window.selectedImageFiles === 'undefined') {
    window.selectedImageFiles = {};
}

function handleMultipleImages(event, widgetId) {
    const files = event.target.files;
    const container = document.getElementById('preview-container-' + widgetId);
    
    if (!container) return;
    
    if (files.length === 0) {
        return;
    }
    
    // Initialize storage for this widget if not exists
    if (!window.selectedImageFiles[widgetId]) {
        window.selectedImageFiles[widgetId] = [];
    }
    
    const maxFileSize = 10 * 1024 * 1024; // 10MB
    const maxFiles = 10;
    const allowedTypes = ['image/jpeg', 'image/jpg', 'image/png', 'image/gif'];
    
    // Add new files to existing ones
    Array.from(files).forEach((file) => {
        // Validate file type
        if (!allowedTypes.includes(file.type)) {
            alert(`Arquivo "${file.name}" não é permitido. Use apenas JPG, PNG ou GIF.`);
            return;
        }
        
        // Validate file size
        if (file.size > maxFileSize) {
            alert(`Arquivo "${file.name}" excede o tamanho máximo de 10MB (${(file.size / 1024 / 1024).toFixed(2)}MB).`);
            return;
        }
        
        // Check total files limit
        if (window.selectedImageFiles[widgetId].length >= maxFiles) {
            alert(`Máximo de ${maxFiles} imagens atingido.`);
            return;
        }
        
        // Add file to storage
        window.selectedImageFiles[widgetId].push(file);
    });
    
    // Clear and rebuild preview with all files
    container.innerHTML = '';
    
    window.selectedImageFiles[widgetId].forEach((file, index) => {
        const reader = new FileReader();
        
        reader.onload = (e) => {
            const previewDiv = document.createElement('div');
            previewDiv.className = 'relative w-full aspect-video bg-base-200 rounded-box border border-base-300 overflow-hidden group';
            previewDiv.innerHTML = `
                <img src="${e.target.result}" class="w-full h-full object-cover" alt="Preview ${index + 1}">
                <div class="absolute top-2 right-2 badge badge-primary badge-sm">Nova</div>
                <div class="absolute bottom-2 left-2 text-xs bg-black/50 text-white px-2 py-1 rounded">${file.name}</div>
                <button type="button" 
                        onclick="removeImagePreview('${widgetId}', ${index})"
                        class="absolute top-2 left-2 btn btn-circle btn-xs btn-error opacity-0 group-hover:opacity-100 transition-opacity"
                        title="Remover">
                    ✕
                </button>
            `;
            container.appendChild(previewDiv);
        };
        
        reader.readAsDataURL(file);
    });
    
    // Update file input with all selected files
    updateFileInput(widgetId);
    
    // Reset the input value so the same file can be added again if removed
    event.target.value = '';
}

function removeImagePreview(widgetId, index) {
    if (!window.selectedImageFiles[widgetId]) return;
    
    // Remove file from storage
    window.selectedImageFiles[widgetId].splice(index, 1);
    
    // Rebuild preview
    const container = document.getElementById('preview-container-' + widgetId);
    if (!container) return;
    
    container.innerHTML = '';
    
    window.selectedImageFiles[widgetId].forEach((file, newIndex) => {
        const reader = new FileReader();
        
        reader.onload = (e) => {
            const previewDiv = document.createElement('div');
            previewDiv.className = 'relative w-full aspect-video bg-base-200 rounded-box border border-base-300 overflow-hidden group';
            previewDiv.innerHTML = `
                <img src="${e.target.result}" class="w-full h-full object-cover" alt="Preview ${newIndex + 1}">
                <div class="absolute top-2 right-2 badge badge-primary badge-sm">Nova</div>
                <div class="absolute bottom-2 left-2 text-xs bg-black/50 text-white px-2 py-1 rounded">${file.name}</div>
                <button type="button" 
                        onclick="removeImagePreview('${widgetId}', ${newIndex})"
                        class="absolute top-2 left-2 btn btn-circle btn-xs btn-error opacity-0 group-hover:opacity-100 transition-opacity"
                        title="Remover">
                    ✕
                </button>
            `;
            container.appendChild(previewDiv);
        };
        
        reader.readAsDataURL(file);
    });
    
    // Update file input
    updateFileInput(widgetId);
}

function updateFileInput(widgetId) {
    const input = document.getElementById(widgetId);
    if (!input) return;
    
    // Create a new FileList from our stored files
    const dt = new DataTransfer();
    window.selectedImageFiles[widgetId].forEach(file => {
        dt.items.add(file);
    });
    input.files = dt.files;
}
</script>
