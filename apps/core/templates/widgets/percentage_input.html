{% load l10n %}
{% with raw=widget.value|default_if_none:"" %}
<div
    x-data="formatters.widget.percentageInput(
        '{{ raw|unlocalize|escapejs }}', 
        '{{ widget.min_percent|default:0|unlocalize|escapejs }}', 
        '{{ widget.max_percent|default:100|unlocalize|escapejs }}',
        '{{ widget.decimal_places|default:2 }}',
        '{{ widget.behavior|default:"free_decimal"|escapejs }}'
    )"
    x-init="init()"
    class="relative"
    {% if widget.attrs.title %}title="{{ widget.attrs.title }}"{% endif %}
>
    <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3">
        <span class="sm:text-sm">%</span>
    </div>

    <!-- input visível (apenas UI) -->
    <input
        type="text"
        id="{{ widget.attrs.id }}_display"
        x-ref="display"
        @input="handleInput"
        @blur="handleBlur"
        inputmode="decimal"
        autocomplete="off"
        placeholder="0,00"
        class="input-theme pl-8 pr-2 {{ widget.attrs.class }}"
        {% if widget.attrs.required %}required{% endif %}
        {% if widget.attrs.disabled %}disabled{% endif %}
        {% if widget.attrs.readonly %}readonly{% endif %}
        {% for name, value in widget.attrs.items %}
            {% if name != "id" and name != "name" and name != "placeholder" and name != "required" and name != "disabled" and name != "readonly" and name != "class" %}
                {% if value is True %}{{ name }}{% elif value is False or value is None %}{% else %}{{ name }}="{{ value|escape }}"{% endif %}
            {% endif %}
        {% endfor %}
    >

    <!-- input real (vai no POST) - fração decimal -->
    <input
        type="hidden"
        x-ref="value"
        name="{{ widget.name }}"
        id="{{ widget.attrs.id }}"
        value="{{ raw|unlocalize }}"
        {% if widget.attrs.disabled %}disabled{% endif %}
        {% for name, value in widget.attrs.items %}
            {% if name != "id" and name != "name" and name != "placeholder" and name != "required" and name != "disabled" and name != "readonly" and name != "class" %}
                {% if value is True %}{{ name }}{% elif value is False or value is None %}{% else %}{{ name }}="{{ value|escape }}"{% endif %}
            {% endif %}
        {% endfor %}
    >
</div>
{% endwith %}
