{% load l10n %}
{% with raw=widget.value|default_if_none:"" %}
<div
    x-data="formatters.widget.moneyInput('{{ raw|unlocalize|escapejs }}')"
    x-init="init()"
    class="w-full"
>
    <div class="relative">
        <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3">
            <span class="sm:text-sm">R$</span>
        </div>
        <input
            type="text"
            id="{{ widget.attrs.id }}_display"
            x-ref="display"
            @input="handleInput"
            inputmode="numeric"
            autocomplete="off"
            placeholder="0,00"
            class="input-theme pl-8 {{ widget.attrs.class }}"
            {% if widget.attrs.required %}required{% endif %}
            {% if widget.attrs.disabled %}disabled{% endif %}
            {% if widget.attrs.readonly %}readonly{% endif %}
        >
    </div>
    <input
        type="hidden"
        x-ref="amount"
        name="{{ widget.name }}"
        id="{{ widget.attrs.id }}"
        value="{{ raw|unlocalize }}"
        {% if widget.attrs.disabled %}disabled{% endif %}
    >
</div>
{% endwith %}
