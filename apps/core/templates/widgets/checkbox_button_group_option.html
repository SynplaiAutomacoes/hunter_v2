<label class="inline-flex cursor-pointer select-none">
    <input type="checkbox"
           name="{{ widget.name }}"
           value="{{ widget.value|stringformat:'s' }}"
           {% if widget.attrs.id %}id="{{ widget.attrs.id }}"{% endif %}
           {% if widget.selected %}checked{% endif %}
           class="peer sr-only">
    <span class="inline-flex h-8 items-center justify-center rounded-full border border-base-300 bg-base-100 px-3.5 text-sm font-medium leading-none text-base-content/80 transition peer-checked:border-primary peer-checked:bg-primary peer-checked:text-primary-content peer-checked:shadow-sm peer-focus-visible:outline peer-focus-visible:outline-2 peer-focus-visible:outline-offset-2 peer-focus-visible:outline-primary hover:border-primary/50 hover:bg-base-200/60">
        {{ widget.label }}
    </span>
</label>
