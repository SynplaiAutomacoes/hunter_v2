<dialog id="data-import-rollback-modal" class="modal" open>
    <div class="modal-box w-11/12 max-w-2xl max-h-[90vh] overflow-y-auto bg-base-100 shadow-2xl border border-base-300">
        <h3 class="font-bold text-xl mb-2 flex items-center gap-2">
            <span class="material-icons">task_alt</span>
            Desfazer — {{ entity_label }}
        </h3>

        {% if error %}
            <div class="alert alert-error mb-4"><span>{{ error }}</span></div>
        {% endif %}

        {% if result %}
            <div class="grid grid-cols-3 gap-3 mb-4">
                <div class="stat bg-success/10 rounded-box p-3">
                    <div class="stat-title text-xs">Removidos</div>
                    <div class="stat-value text-success text-2xl">{{ result.deleted_count }}</div>
                </div>
                <div class="stat bg-warning/10 rounded-box p-3">
                    <div class="stat-title text-xs">Bloqueados</div>
                    <div class="stat-value text-warning text-2xl">{{ result.blocked_count }}</div>
                </div>
                <div class="stat bg-base-200 rounded-box p-3">
                    <div class="stat-title text-xs">Já inexistentes</div>
                    <div class="stat-value text-2xl">{{ result.missing_count }}</div>
                </div>
            </div>
            <p class="text-sm mb-4">Status do lote: <strong>{{ batch.get_status_display }}</strong></p>
        {% endif %}

        <div class="modal-action">
            <a href="{% url 'core:data_import_history' %}?entity={{ batch.entity_key }}" class="btn btn-ghost">Histórico</a>
            <button
                type="button"
                class="btn btn-primary"
                onclick="document.getElementById('modal-container').innerHTML=''; window.location.reload();"
            >Fechar</button>
        </div>
    </div>
    <form method="dialog" class="modal-backdrop">
        <button type="button" onclick="document.getElementById('modal-container').innerHTML=''; window.location.reload();">fechar</button>
    </form>
</dialog>
