<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "base-100": "oklch(100% 0 0)",
                        "base-200": "oklch(96% 0 0)",
                        "base-300": "oklch(92% 0 0)",
                        "base-content": "oklch(20% 0 0)",
                        "primary": "oklch(60% 0.15 250)",
                        "success": "oklch(60% 0.15 150)",
                        "warning": "oklch(60% 0.15 80)",
                        "error": "oklch(60% 0.15 20)",
                        "info": "oklch(60% 0.15 200)",
                    },
                },
            },
        }
    </script>
    <title>{{ report_title }}</title>
    <style>
        @page { size: A4; margin: 0; }
        body { margin: 0; padding: 0; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        .pdf-page { width: 210mm; min-height: 297mm; box-sizing: border-box; }

        details { display: block; }
        details[open] > summary + div { display: block; }
        details > summary { list-style: none; cursor: default; }
        details > summary::-webkit-details-marker { display: none; }
        details > summary::marker { display: none; }

        :root {
            --b1: 100% 0 0;
            --b2: 96% 0 0;
            --b3: 92% 0 0;
            --bc: 20% 0 0;
            --p: 60% 0.15 250;
            --s: 60% 0.15 150;
            --wa: 60% 0.15 80;
            --er: 60% 0.15 20;
            --in: 60% 0.15 200;
        }

        .table {
            width: 100%;
            text-align: left;
            font-size: 0.7rem;
            line-height: 1.1rem;
            border-collapse: collapse;
        }
        .table th {
            padding: 0.5rem;
            vertical-align: middle;
            font-weight: 600;
            background-color: oklch(var(--b2));
        }
        .table td {
            padding: 0.5rem;
            vertical-align: middle;
        }
        .table-zebra tbody tr:nth-child(even) td,
        .table-zebra tbody tr:nth-child(even) th {
            background-color: oklch(var(--b2) / 0.5);
        }
        .table-sm th,
        .table-sm td {
            padding: 0.375rem;
        }

        .bg-base-200\/70 { background-color: oklch(96% 0 0 / 0.7); }
        .bg-base-200\/60 { background-color: oklch(96% 0 0 / 0.6); }
        .bg-base-200\/20 { background-color: oklch(96% 0 0 / 0.2); }
        .border-base-300\/70 { border-color: oklch(92% 0 0 / 0.7); }
        .border-base-300\/80 { border-color: oklch(92% 0 0 / 0.8); }
        .border-base-300\/60 { border-color: oklch(92% 0 0 / 0.6); }
        .text-base-content\/45 { color: oklch(20% 0 0 / 0.45); }
        .text-base-content\/50 { color: oklch(20% 0 0 / 0.5); }
        .text-base-content\/55 { color: oklch(20% 0 0 / 0.55); }
        .text-base-content\/60 { color: oklch(20% 0 0 / 0.6); }
        .text-base-content\/65 { color: oklch(20% 0 0 / 0.65); }
        .text-base-content\/70 { color: oklch(20% 0 0 / 0.7); }
        .bg-primary\/10 { background-color: oklch(60% 0.15 250 / 0.1); }
        .border-primary\/20 { border-color: oklch(60% 0.15 250 / 0.2); }
        .text-primary\/70 { color: oklch(60% 0.15 250 / 0.7); }
        .bg-success\/10 { background-color: oklch(60% 0.15 150 / 0.1); }
        .bg-success\/15 { background-color: oklch(60% 0.15 150 / 0.15); }
        .border-success\/15 { border-color: oklch(60% 0.15 150 / 0.15); }
        .border-success\/20 { border-color: oklch(60% 0.15 150 / 0.2); }
        .text-success\/70 { color: oklch(60% 0.15 150 / 0.7); }
        .bg-warning\/10 { background-color: oklch(60% 0.15 80 / 0.1); }
        .border-warning\/20 { border-color: oklch(60% 0.15 80 / 0.2); }
        .text-warning\/70 { color: oklch(60% 0.15 80 / 0.7); }
        .bg-error\/10 { background-color: oklch(60% 0.15 20 / 0.1); }
        .bg-error\/5 { background-color: oklch(60% 0.15 20 / 0.05); }
        .border-error\/20 { border-color: oklch(60% 0.15 20 / 0.2); }
        .text-error\/70 { color: oklch(60% 0.15 20 / 0.7); }
        .bg-info\/10 { background-color: oklch(60% 0.15 200 / 0.1); }
        .border-info\/20 { border-color: oklch(60% 0.15 200 / 0.2); }
        .text-info\/70 { color: oklch(60% 0.15 200 / 0.7); }
    </style>
    <style>
        .pdf-mode .text-2xl { font-size: 1.125rem !important; }
        .pdf-mode .text-3xl { font-size: 1.375rem !important; }
        .pdf-mode .text-lg { font-size: 0.875rem !important; }
        .pdf-mode .text-sm { font-size: 0.75rem !important; }
        .pdf-mode .text-xs { font-size: 0.625rem !important; }
        .pdf-mode [class*="text-[11px]"] { font-size: 9px !important; }
        .pdf-mode [class*="xl:text-[2rem]"] { font-size: 1.25rem !important; }
        .pdf-mode .text-base { font-size: 0.6875rem !important; }
        .pdf-mode .table { font-size: 0.625rem !important; line-height: 0.9375rem !important; }
        .pdf-mode p.tabular-nums { font-size: 0.875rem !important; white-space: nowrap !important; }

        .pdf-mode .p-4 { padding: 0.625rem !important; }
        .pdf-mode .p-5 { padding: 0.75rem !important; }
        .pdf-mode .p-6 { padding: 1rem !important; }
        .pdf-mode .px-4 { padding-left: 0.625rem !important; padding-right: 0.625rem !important; }
        .pdf-mode .px-5 { padding-left: 0.75rem !important; padding-right: 0.75rem !important; }
        .pdf-mode .px-6 { padding-left: 1rem !important; padding-right: 1rem !important; }
        .pdf-mode .py-3 { padding-top: 0.5rem !important; padding-bottom: 0.5rem !important; }
        .pdf-mode .py-4 { padding-top: 0.625rem !important; padding-bottom: 0.625rem !important; }
        .pdf-mode .py-5 { padding-top: 0.75rem !important; padding-bottom: 0.75rem !important; }
        .pdf-mode .gap-2 { gap: 0.25rem !important; }
        .pdf-mode .gap-3 { gap: 0.375rem !important; }
        .pdf-mode .gap-4 { gap: 0.5rem !important; }
        .pdf-mode .gap-5 { gap: 0.625rem !important; }
        .pdf-mode .gap-10 { gap: 1.25rem !important; }
        .pdf-mode .space-y-4 > :not([hidden]) ~ :not([hidden]) { margin-top: 0.5rem !important; }
        .pdf-mode .mt-2 { margin-top: 0.25rem !important; }
        .pdf-mode .mt-5 { margin-top: 0.625rem !important; }
        .pdf-mode .mt-6 { margin-top: 0.75rem !important; }

        .pdf-mode [class*="min-w-[220px]"] { min-width: 115px !important; }
        .pdf-mode [class*="min-w-[240px]"] { min-width: 125px !important; }
        .pdf-mode .w-44 { width: 100px !important; }
        .pdf-mode .w-36 { width: 80px !important; }
        .pdf-mode .w-28 { width: 60px !important; }
        .pdf-mode .w-24 { width: 55px !important; }

        .pdf-mode .table th,
        .pdf-mode .table td { padding: 0.3rem !important; }
        .pdf-mode .table-sm th,
        .pdf-mode .table-sm td { padding: 0.2rem !important; }

        .pdf-mode [class*="rounded-[1.75rem]"] { border-radius: 0.75rem !important; }
        .pdf-mode [class*="rounded-[1.25rem]"] { border-radius: 0.5rem !important; }
        .pdf-mode [class*="rounded-[1.5rem]"] { border-radius: 0.625rem !important; }

        .pdf-mode .overflow-x-auto { overflow: hidden !important; }
        .pdf-mode table td.tabular-nums,
        .pdf-mode table th.tabular-nums { white-space: nowrap !important; }
        .pdf-mode table td:not(.tabular-nums),
        .pdf-mode table th:not(.tabular-nums) { overflow-wrap: break-word !important; }
    </style>
</head>
<body class="bg-base-200 pdf-mode">
    <div class="pdf-page mx-auto bg-base-100 p-6 shadow-lg">
        {% include "core/partials/_financial_report_content.html" %}

        <div class="mt-6 border-t border-base-300 px-1 pt-3 text-[10px] text-base-content/50">
            <p>Emitido em {% now "d/m/Y H:i" %}.</p>
        </div>
    </div>
</body>
</html>
