{% extends 'crud/page.html' %}

{% block crud_content %}

    <div class="flex items-center justify-between gap-4">
        <div>
            <h1 class="text-3xl font-bold text-base-content">{% block crud_title %}{% endblock %}</h1>
            <p class="text-base-content/70 mt-1">{% block crud_subtitle %}{% endblock %}</p>
        </div>

        {% block crud_header_actions %}{% endblock %}
    </div>

    <div class="card bg-base-100 shadow-xl" style="overflow: visible;">
        <div class="card-body p-6 md:p-8" style="overflow: visible;">
            <div
                id="{% block crud_table_wrapper_id %}table-wrapper{% endblock %}"
                hx-get="{% block crud_table_hx_get %}{{ request.path }}{% endblock %}"
                hx-trigger="{% block crud_table_hx_trigger %}table-refresh from:body{% endblock %}"
                hx-target="this"
                hx-swap="innerHTML"
            >
                {% block crud_table %}{% endblock %}
            </div>

            <script>
                (function () {
                    const wrapper = document.currentScript.previousElementSibling;
                    if (!wrapper || wrapper.dataset.queryParamsBound === 'true') return;

                    wrapper.dataset.queryParamsBound = 'true';
                    wrapper.addEventListener('htmx:configRequest', function (event) {
                        if (!event.detail || event.detail.elt !== wrapper) return;

                        const searchParams = new URLSearchParams(window.location.search);
                        const baseUrl = wrapper.getAttribute('hx-get') || window.location.pathname;
                        const queryString = searchParams.toString();

                        event.detail.path = queryString ? `${baseUrl}?${queryString}` : baseUrl;
                        event.detail.parameters = {};
                    });
                })();
            </script>
        </div>
    </div>

    <div id="{% block crud_modal_container_id %}modal-container{% endblock %}"></div>

{% endblock %}
