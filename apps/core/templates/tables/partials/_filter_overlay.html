<div
    class="relative z-50 flex w-full items-center gap-2 overflow-visible sm:w-auto"
    x-data="{ open: false, controlsFormId: '{{ table_id }}-controls-form' }"
    @keydown.escape.window="open = false"
    @click.outside="open = false"
    @submit.window="if ($event.target && $event.target.id === controlsFormId) open = false"
>
    <button
        type="button"
        class="btn btn-primary flex-1 sm:w-auto sm:flex-none"
        :aria-expanded="open.toString()"
        aria-controls="{{ table_id }}-filter-panel"
        @click="open = !open"
    >
        <span class="material-icons text-[18px]" aria-hidden="true">filter_list</span>
        {{ filter_button_label }}
    </button>

    {% if has_active_filters and clear_filter_url %}
        <button
            type="button"
            class="btn btn-error flex-1 text-white sm:w-auto sm:flex-none"
            @click="open = false"
            hx-get="{{ clear_filter_url }}"
            hx-target="{{ htmx_target }}"
            hx-swap="{{ htmx_swap }}"
            hx-select="{{ htmx_select }}"
            hx-push-url="{{ htmx_push_url }}"
        >
            Limpar Filtro
        </button>
    {% endif %}

    <div
        id="{{ table_id }}-filter-panel"
        x-show="open"
        x-cloak
        x-transition:enter="transition ease-out duration-150"
        x-transition:enter-start="opacity-0 -translate-y-3"
        x-transition:enter-end="opacity-100 translate-y-0"
        x-transition:leave="transition ease-in duration-100"
        x-transition:leave-start="opacity-100 translate-y-0"
        x-transition:leave-end="opacity-0 -translate-y-2"
        class="absolute right-0 top-full z-[120] mt-2 w-[calc(100vw-2rem)] max-w-[calc(100vw-2rem)] sm:w-[64rem] lg:w-[76rem] xl:w-[88rem] rounded-xl border border-base-300 bg-base-100 shadow-2xl"
    >
        <div class="p-4 sm:p-5">
            <h3 class="text-base font-semibold text-base-content">{{ filter_panel_title }}</h3>

            <div class="mt-4 space-y-4">
                {% include filter_fields_template %}
            </div>

            <div class="mt-6 flex items-center justify-end gap-2">
                <button type="button" class="btn-form-cancel" @click="open = false">Cancelar</button>
                <button
                    type="submit"
                    class="btn btn-primary"
                    @click="open = false"
                >
                    Filtrar
                </button>
            </div>
        </div>
    </div>
</div>
