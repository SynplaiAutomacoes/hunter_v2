<div
    class="relative z-50 flex w-full items-center gap-2 overflow-visible sm:w-auto"
    x-data="{ open: false, controlsFormId: '{{ table_id }}-controls-form' }"
    @keydown.escape.window="open = false"
    @click.outside="open = false"
    @htmx:before-request.window="if ($event.detail && $event.detail.elt && $event.detail.elt.id === controlsFormId) open = false"
>
    <button
        type="button"
        class="btn btn-primary flex-1 sm:w-auto sm:flex-none"
        :aria-expanded="open.toString()"
        aria-controls="{{ table_id }}-filter-panel"
        @click="open = !open"
    >
        <span class="material-icons text-[18px]" aria-hidden="true">filter_list</span>
        {{ filter_button_label }}
    </button>

    {% if has_active_filters and clear_filter_url %}
        <button
            type="button"
            class="btn btn-error flex-1 text-white sm:w-auto sm:flex-none"
            @click="open = false"
            hx-get="{{ clear_filter_url }}"
            hx-params="none"
            hx-target="{{ htmx_target }}"
            hx-swap="{{ htmx_swap }}"
            hx-select="{{ htmx_select }}"
            hx-push-url="{{ htmx_push_url }}"
        >
            Limpar Filtro
        </button>
    {% endif %}

    <div
        id="{{ table_id }}-filter-panel"
        x-bind:hidden="!open"
        hidden
        x-cloak
        class="absolute inset-x-0 top-full z-50 mt-2 flex max-h-[70vh] w-full flex-col rounded-xl border border-base-300 bg-base-100 shadow-2xl sm:inset-x-auto sm:right-0 sm:w-fit sm:min-w-[20rem] sm:max-w-xl md:max-w-2xl"
    >
        <div class="flex h-full min-h-0 flex-col p-4 sm:p-5">
            <h3 class="text-base font-semibold text-base-content">{{ filter_panel_title }}</h3>

            <div class="mt-4 min-h-0 flex-1 space-y-4 overflow-y-auto pr-1">
                {% include filter_fields_template %}
            </div>

            <div class="mt-6 flex items-center justify-end gap-2 border-t border-base-200 pt-4">
                <button type="button" class="btn-form-cancel" @click="open = false">Cancelar</button>
                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Filtrar
                </button>
            </div>
        </div>
    </div>
</div>
