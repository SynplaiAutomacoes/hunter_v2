<div
    class="flex w-full items-center gap-2 sm:w-auto"
    x-data="{
        controlsFormId: '{{ table_id }}-controls-form',
        closeOnBackdrop(event) {
            if (event.target !== event.currentTarget) {
                return;
            }

            const selectedText = window.getSelection ? window.getSelection().toString().trim() : '';
            if (selectedText) {
                return;
            }

            const activeElement = document.activeElement;
            const isTextField = activeElement && (activeElement.tagName === 'INPUT' || activeElement.tagName === 'TEXTAREA');
            if (isTextField) {
                const selectionStart = typeof activeElement.selectionStart === 'number' ? activeElement.selectionStart : null;
                const selectionEnd = typeof activeElement.selectionEnd === 'number' ? activeElement.selectionEnd : null;
                if (selectionStart !== null && selectionEnd !== null && selectionStart !== selectionEnd) {
                    return;
                }
            }

            this.$refs.filterModal.close();
        }
    }"
    @htmx:before-request.window="if ($event.detail && $event.detail.elt && $event.detail.elt.id === controlsFormId && $refs.filterModal?.open) $refs.filterModal.close()"
>
    <button
        type="button"
        class="btn btn-primary flex-1 sm:w-auto sm:flex-none"
        aria-controls="{{ table_id }}-filter-modal"
        aria-haspopup="dialog"
        @click="$refs.filterModal.showModal()"
    >
        <span class="material-icons text-[18px]" aria-hidden="true">filter_list</span>
        {{ filter_button_label }}
    </button>

    {% if has_active_filters and clear_filter_url %}
        <button
            type="button"
            class="btn btn-error flex-1 text-white sm:w-auto sm:flex-none"
            @click="open = false"
            hx-get="{{ clear_filter_url }}"
            hx-params="none"
            hx-target="{{ htmx_target }}"
            hx-swap="{{ htmx_swap }}"
            hx-select="{{ htmx_select }}"
            hx-push-url="{{ htmx_push_url }}"
        >
            Limpar Filtro
        </button>
    {% endif %}

    <dialog
        id="{{ table_id }}-filter-modal"
        class="modal"
        x-ref="filterModal"
        @click="closeOnBackdrop($event)"
    >
        <div class="modal-box w-11/12 max-w-2xl border border-base-300 bg-base-100 shadow-2xl">
            <h3 class="text-base font-semibold text-base-content">{{ filter_panel_title }}</h3>

            <div class="mt-4 max-h-[65vh] space-y-4 overflow-y-auto pr-1">
                {% include filter_fields_template %}
            </div>

            <div class="modal-action mt-6 flex items-center justify-end gap-2 border-t border-base-200 pt-4">
                <button type="button" class="btn-form-cancel" @click="$refs.filterModal.close()">Cancelar</button>
                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Filtrar
                </button>
            </div>
        </div>
    </dialog>
</div>
