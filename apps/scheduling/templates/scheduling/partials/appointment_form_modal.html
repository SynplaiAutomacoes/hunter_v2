{% load crispy_forms_tags %}

<div class="modal-box appointment-modal-shell w-[96vw] max-w-7xl overflow-visible border border-base-300 bg-base-100 p-0 shadow-2xl">
    <div class="mb-4 flex items-center justify-between gap-2">
        <h3 class="text-2xl font-bold">{% if is_update %}Editar Agendamento{% else %}Novo Agendamento{% endif %}</h3>
        <button type="button" class="btn btn-sm btn-circle btn-ghost" onclick="document.getElementById('appointment_modal').close()">✕</button>
    </div>

    <form
        data-appointment-form="1"
        method="post"
        action="{{ request.path }}{% if request.META.QUERY_STRING %}?{{ request.META.QUERY_STRING }}{% endif %}"
        hx-post="{{ request.path }}{% if request.META.QUERY_STRING %}?{{ request.META.QUERY_STRING }}{% endif %}"
        hx-target="#appointment-modal-container"
        hx-swap="innerHTML"
        class="space-y-5"
    >
        {% csrf_token %}
        {{ form.block_color }}

        <div class="grid grid-cols-1 gap-3 rounded-xl border border-base-300 bg-base-200/30 p-4 md:grid-cols-3">
            <div class="space-y-2 md:col-span-2">
                <p class="text-sm font-semibold">Cor do bloco</p>
                <div class="flex flex-wrap gap-2">
                    <button type="button" class="h-8 w-8 rounded-full border-2 border-white ring-1 ring-base-300" style="background:#0ea5e9" onclick="window.setAppointmentColor && window.setAppointmentColor('#0ea5e9')" aria-label="Azul"></button>
                    <button type="button" class="h-8 w-8 rounded-full border-2 border-white ring-1 ring-base-300" style="background:#22c55e" onclick="window.setAppointmentColor && window.setAppointmentColor('#22c55e')" aria-label="Verde"></button>
                    <button type="button" class="h-8 w-8 rounded-full border-2 border-white ring-1 ring-base-300" style="background:#f59e0b" onclick="window.setAppointmentColor && window.setAppointmentColor('#f59e0b')" aria-label="Amarelo"></button>
                    <button type="button" class="h-8 w-8 rounded-full border-2 border-white ring-1 ring-base-300" style="background:#ef4444" onclick="window.setAppointmentColor && window.setAppointmentColor('#ef4444')" aria-label="Vermelho"></button>
                    <button type="button" class="h-8 w-8 rounded-full border-2 border-white ring-1 ring-base-300" style="background:#8b5cf6" onclick="window.setAppointmentColor && window.setAppointmentColor('#8b5cf6')" aria-label="Violeta"></button>
                    <button type="button" class="h-8 w-8 rounded-full border-2 border-white ring-1 ring-base-300" style="background:#14b8a6" onclick="window.setAppointmentColor && window.setAppointmentColor('#14b8a6')" aria-label="Turquesa"></button>
                </div>
            </div>

            <div class="rounded-lg border border-base-300 bg-base-100 p-3">
                <p class="mb-2 text-xs uppercase tracking-wide text-base-content/70">Preview</p>
                <div id="appointment-color-preview" class="h-8 rounded-md bg-sky-500"></div>
            </div>
        </div>

        <div class="rounded-xl border border-base-300 bg-base-100 p-5 md:p-6">
            {% crispy form %}
        </div>

        <div class="modal-action appointment-modal-actions mt-4 border-t border-base-300 bg-base-100/90 px-3 py-3">
            {% if is_update and delete_url %}
                <button
                    type="button"
                    class="btn btn-error text-white mr-auto"
                    hx-post="{{ delete_url }}"
                    hx-target="#appointment-modal-container"
                    hx-swap="innerHTML"
                    hx-confirm="Tem certeza que deseja excluir este agendamento?"
                >
                    Excluir
                </button>
            {% endif %}

            <button type="submit" name="action" value="save_and_create_budget" class="btn btn-secondary mr-auto">
                Salvar e Cadastrar no Orçamento
            </button>

            <button type="button" class="btn btn-ghost" onclick="document.getElementById('appointment_modal').close()">Cancelar</button>
            <button type="submit" class="btn btn-primary">Salvar</button>
        </div>
    </form>
</div>

<script>
    (function () {
        const modalForm = document.querySelector('#appointment-modal-container form[data-appointment-form="1"]');
        const colorInput = document.getElementById('id_block_color');
        const preview = document.getElementById('appointment-color-preview');

        if (modalForm && !modalForm.dataset.hxSubmitBound) {
            modalForm.dataset.hxSubmitBound = '1';
            modalForm.addEventListener('submit', function (event) {
                event.preventDefault();
                const formData = new FormData(modalForm);
                const submitter = event.submitter;
                if (submitter && submitter.name) {
                    formData.append(submitter.name, submitter.value || '');
                }

                htmx.ajax('POST', modalForm.action, {
                    source: modalForm,
                    target: '#appointment-modal-container',
                    swap: 'innerHTML',
                    values: Object.fromEntries(formData.entries()),
                });
            });
        }

        if (!colorInput || !preview) {
            return;
        }

        function syncColorPreview(value) {
            preview.style.background = value || '#0ea5e9';
        }

        syncColorPreview(colorInput.value);

        colorInput.addEventListener('input', function () {
            syncColorPreview(colorInput.value);
        });

        window.setAppointmentColor = function (value) {
            colorInput.value = value;
            colorInput.dispatchEvent(new Event('input', { bubbles: true }));
            syncColorPreview(value);
        };
    })();
</script>

<style>
    #appointment_modal .modal-box {
        overflow: visible;
    }

    #appointment_modal .appointment-modal-shell {
        max-height: 92vh;
    }

    #appointment_modal .appointment-modal-shell > form {
        max-height: calc(92vh - 5.5rem);
        overflow-y: auto;
        padding: 0 1.2rem 1rem;
    }

    #appointment_modal .appointment-modal-shell > .mb-4 {
        position: sticky;
        top: 0;
        z-index: 20;
        margin: 0;
        padding: 1.25rem 1.3rem 1rem;
        border-bottom: 1px solid hsl(var(--b3));
        background: hsl(var(--b1));
    }

    #appointment_modal .input-theme,
    #appointment_modal .select,
    #appointment_modal button.input-theme,
    #appointment_modal textarea,
    #appointment_modal input[type="datetime-local"],
    #appointment_modal input[type="text"] {
        min-height: 2.8rem;
        font-size: 1rem;
    }

    #appointment_modal textarea {
        min-height: 7rem;
    }

    #appointment_modal label {
        margin-bottom: 0.4rem;
        display: inline-block;
        font-size: 0.92rem;
        color: hsl(var(--bc) / 0.8);
    }

    #appointment_modal .appointment-modal-actions {
        position: sticky;
        bottom: 0;
        z-index: 15;
        backdrop-filter: blur(3px);
    }

    #appointment_modal ul[role="listbox"] {
        max-height: 16rem;
    }

    #appointment_modal .relative .absolute.z-50 {
        z-index: 80;
    }
</style>
