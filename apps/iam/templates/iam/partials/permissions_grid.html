<div class="space-y-8">
    {% for app_label, models in form.grouped_permissions.items %}
    <div class="app-group">
        <h4 class="text-lg font-black text-primary uppercase tracking-wider mb-2 mt-4 flex items-center gap-2">
            <span class="w-2 h-6 bg-primary rounded-full"></span>
            {{ app_label }}
        </h4>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            {% for model_name, perms in models.items %}
            <div class="card bg-base-200 border border-base-300 shadow-sm">
                <div class="card-body p-4">
                    <h5 class="font-bold text-sm border-b border-base-300 pb-1 mb-3 text-base-content/70">
                        {{ model_name }}
                    </h5>

                    <div class="flex flex-col gap-2">
                        {% for perm in perms %}
                        <label class="flex items-center gap-2 cursor-pointer hover:bg-base-300 rounded p-1 transition-all">
                            <input type="checkbox" name="permissions" value="{{ perm.id }}" class="checkbox checkbox-xs checkbox-primary"
                                   {% if perm.id in form.permissions.value or perm in form.permissions.value %}checked{% endif %}>
                            <span class="text-xs">
                                {% if "Can add" in perm.name %}Criar
                                {% elif "Can change" in perm.name %}Editar
                                {% elif "Can delete" in perm.name %}Excluir
                                {% elif "Can view" in perm.name %}Visualizar
                                {% else %}{{ perm.name }}{% endif %}
                            </span>
                        </label>
                        {% endfor %}
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
    {% endfor %}
</div>
