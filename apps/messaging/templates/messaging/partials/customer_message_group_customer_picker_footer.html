<div class="mt-4 flex flex-col gap-3 border-t border-base-200 pt-4 sm:flex-row sm:items-center sm:justify-between">
    <p class="text-sm text-base-content/70">Os checkboxes adicionam ou removem clientes do grupo automaticamente. Use os botoes para acoes em lote.</p>

    <div class="flex flex-col gap-2 sm:flex-row">
        <button type="button" class="btn btn-primary" @click="addSelectedCustomersFromTable()">
            Adicionar selecionados
        </button>
        <button type="button" class="btn btn-outline btn-error" @click="removeSelectedCustomersFromTable()">
            Remover do grupo
        </button>
    </div>
</div>
