<div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
    <div class="sm:col-span-2">
        <label for="{{ table_id }}-filter-status">Status do cliente</label>
        <select name="is_active" id="{{ table_id }}-filter-status" class="select select-bordered w-full">
            <option value="">Ativos</option>
            <option value="all" {% if request.GET.is_active == 'all' %}selected{% endif %}>Todos</option>
            <option value="0" {% if request.GET.is_active == '0' %}selected{% endif %}>Inativos</option>
        </select>
    </div>

    <div>
        <label for="{{ table_id }}-filter-birth-date-start">Aniversario de</label>
        <input
            type="date"
            name="birth_date_start"
            id="{{ table_id }}-filter-birth-date-start"
            value="{{ request.GET.birth_date_start|default:'' }}"
            class="input-theme"
        />
    </div>

    <div>
        <label for="{{ table_id }}-filter-birth-date-end">Aniversario ate</label>
        <input
            type="date"
            name="birth_date_end"
            id="{{ table_id }}-filter-birth-date-end"
            value="{{ request.GET.birth_date_end|default:'' }}"
            class="input-theme"
        />
    </div>

    <div>
        <label for="{{ table_id }}-filter-latest-os-start">Ultima O.S. de</label>
        <input
            type="date"
            name="latest_os_start"
            id="{{ table_id }}-filter-latest-os-start"
            value="{{ request.GET.latest_os_start|default:'' }}"
            class="input-theme"
        />
    </div>

    <div>
        <label for="{{ table_id }}-filter-latest-os-end">Ultima O.S. ate</label>
        <input
            type="date"
            name="latest_os_end"
            id="{{ table_id }}-filter-latest-os-end"
            value="{{ request.GET.latest_os_end|default:'' }}"
            class="input-theme"
        />
    </div>
</div>
