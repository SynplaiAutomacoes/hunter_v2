{% extends 'crud/page.html' %}
{% block crud_content %}

    <div class="flex items-center justify-between gap-4">
        <div>
            <h1 class="text-3xl font-bold text-base-content">Novo Orçamento</h1>
            <p class="text-base-content/70 mt-1">Crie um novo orçamento seguindo as etapas abaixo</p>
        </div>
    </div>

    <div class="card bg-base-100 shadow-xl">
        <div class="card-body p-6 md:p-8" id="step-container">
            {% include 'budget/partials/budget_step_content.html' %}
        </div>
    </div>

    <dialog id="form_modal" class="modal">
        <div id="modal-container"></div>
    </dialog>

    <dialog id="child_form_modal" class="modal">
        <div id="child-modal-container"></div>
    </dialog>

    <dialog id="grandchild_form_modal" class="modal">
        <div id="grandchild-modal-container"></div>
    </dialog>

    <script>
        (function() {
            function getModal(id) {
                return document.getElementById(id);
            }

            window.openBudgetChildModal = function() {
                const childModal = getModal('child_form_modal');
                if (childModal && !childModal.open) {
                    childModal.showModal();
                }
            };

            window.openBudgetGrandchildModal = function() {
                const grandchildModal = getModal('grandchild_form_modal');
                if (grandchildModal && !grandchildModal.open) {
                    grandchildModal.showModal();
                }
            };

            window.closeBudgetChildModal = function() {
                const childModal = getModal('child_form_modal');
                if (childModal && childModal.open) {
                    childModal.close();
                }
            };

            window.closeBudgetGrandchildModal = function() {
                const grandchildModal = getModal('grandchild_form_modal');
                if (grandchildModal && grandchildModal.open) {
                    grandchildModal.close();
                }
            };

            window.closeBudgetParentModal = function() {
                const parentModal = getModal('form_modal');
                if (parentModal && parentModal.open) {
                    parentModal.close();
                }
            };

            window.getTopBudgetModal = function() {
                const grandchildModal = getModal('grandchild_form_modal');
                if (grandchildModal && grandchildModal.open) {
                    return grandchildModal;
                }

                const childModal = getModal('child_form_modal');
                if (childModal && childModal.open) {
                    return childModal;
                }

                const parentModal = getModal('form_modal');
                if (parentModal && parentModal.open) {
                    return parentModal;
                }

                return null;
            };

            window.closeTopBudgetModal = function() {
                const modal = window.getTopBudgetModal ? window.getTopBudgetModal() : null;
                if (modal) {
                    modal.close();
                }
            };

            if (!window.__budgetCloseParentModalBound) {
                window.__budgetCloseParentModalBound = true;
                document.body.addEventListener('closeParentBudgetModal', function() {
                    window.closeBudgetParentModal();
                });
            }
        })();
    </script>
{% endblock %}
