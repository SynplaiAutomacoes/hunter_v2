{% load crispy_forms_tags %}

<div class="modal-content-wrapper bg-base-100 p-6 rounded-lg">
    <div class="mb-6">
        <div class="flex items-center justify-between gap-3">
            <div class="flex items-center gap-3">
                <span class="material-icons text-primary text-3xl">note_add</span>
                <h3 class="font-bold text-2xl text-base-content">{{ title }}</h3>

                <div id="calculation-indicator" class="htmx-indicator flex items-center gap-2 px-3 py-1 bg-info/10 text-info rounded-full text-sm animate-pulse">
                    <span class="material-icons text-sm animate-spin">sync</span>
                    <span>Calculando...</span>
                </div>
            </div>
        </div>

        <div class="alert alert-warning mt-4">
            <span class="material-icons">info</span>
            <span>Este item será criado apenas neste orçamento. Para aprovar o orçamento, você precisará cadastrá-lo no banco de dados.</span>
        </div>
    </div>

    <form hx-post="{% url 'budget:create_local_item' budget_id item_type %}"
          hx-target="{% if item_type == 'product' %}#product-list-body{% else %}#service-list-body{% endif %}"
          hx-swap="beforeend"
          id="local-item-form"
          class="space-y-4">
        {% csrf_token %}

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="local-item-fields-container">
            {% for field in form %}
                <div id="div_id_{{ field.name }}" class="form-control w-full {% if field.name == 'description' %}md:col-span-2{% endif %}">
                    <label class="label">
                        <span class="label-text font-semibold">{{ field.label }}</span>
                        {% if field.field.required %}
                            <span class="text-error">*</span>
                        {% endif %}
                    </label>
                    {{ field }}
                    {% if field.errors %}
                        <label class="label">
                            <span class="label-text-alt text-error">{{ field.errors.0 }}</span>
                        </label>
                    {% endif %}
                </div>
            {% endfor %}
        </div>

        <div class="divider"></div>

        <div class="flex justify-end gap-3">
            <button type="button"
                    class="btn btn-ghost"
                    onclick="document.getElementById('form_modal').close()">
                Cancelar
            </button>

            <button type="submit" class="btn btn-primary gap-2">
                <span class="material-icons text-sm">save</span>
                Salvar Item Local
            </button>
        </div>
    </form>
</div>

<script>
    document.body.addEventListener('closeModal', function() {
        document.getElementById('form_modal').close();
    });
</script>
