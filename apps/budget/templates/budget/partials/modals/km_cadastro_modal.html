<dialog
    id="budget-km-cadastro-modal"
    class="modal"
    onclick="if (event.target === this) this.close()"
>
    <div class="modal-box max-w-lg border border-base-300 bg-base-100 shadow-2xl">
        <h3 class="text-xl font-bold">KM cadastrado do cliente</h3>
        <p id="budget-km-cadastro-modal-message" class="mt-3 text-sm leading-relaxed text-base-content/80"></p>
        <div class="modal-action flex-wrap gap-2">
            <button type="button" class="btn btn-ghost" onclick="document.getElementById('budget-km-cadastro-modal').close()">Fechar</button>
            <button type="button" class="btn btn-primary" onclick="openBudgetVehicleKmUpdate()">Alterar KM no cadastro</button>
        </div>
    </div>
</dialog>
