{% load crispy_forms_field l10n %}

<div class="w-full mb-6" x-data="collaboratorField({% if object and object.is_status_locked %}true{% elif form.instance.pk and form.instance.is_status_locked %}true{% else %}false{% endif %})" id="collaborator-field-container" data-budget-lock-scope="collaborators">
    
    <div class="flex items-center justify-between mb-4 pb-2 border-b border-gray-100">
        <h5 class="font-bold flex items-center gap-2">
            <span class="material-icons text-primary">group</span>
            Colaboradores
        </h5>
        <button type="button" @click="addCollab()" class="btn btn-sm btn-primary gap-1" title="Adicionar Colaborador" :disabled="isLocked" :class="isLocked ? 'btn-disabled opacity-60 cursor-not-allowed' : ''">
            <span class="material-icons">add</span>
            <span>Adicionar</span>
        </button>
    </div>

    <div class="space-y-4 max-h-64 overflow-y-auto pr-2 custom-scrollbar" id="collabs-list">
        <template x-for="(collab, index) in collabs" :key="collab._key">
            <div class="flex items-end gap-2 w-full animate-fadeIn">
                <div class="flex-1">
                    <label class="label p-0 mb-1" x-show="index === 0">
                        <span class="label-text text-xs text-gray-500">Colaborador Principal</span>
                    </label>
                    <label class="label p-0 mb-1" x-show="index > 0">
                        <span class="label-text text-xs text-gray-500">Colaborador Adicional</span>
                    </label>
                    
                    <select name="collaborators_list"
                            :name="'collaborators_list'"
                            class="select select-bordered w-full bg-base-200"
                            x-model="collab.id"
                            @change="notifyAutosave()"
                            :disabled="isLocked"
                            {% if object and object.is_status_locked %}disabled{% elif form.instance.pk and form.instance.is_status_locked %}disabled{% endif %}
                            required>
                        <option value="" disabled>Selecione um colaborador...</option>
                        {% for choice_id, choice_label in field.field.choices %}
                            {% if choice_id %}
                            <option value="{{ choice_id|unlocalize }}"
                                    :hidden="isSelectedByOther(index, '{{ choice_id|unlocalize }}')"
                                    :disabled="isSelectedByOther(index, '{{ choice_id|unlocalize }}')">{{ choice_label }}</option>
                            {% endif %}
                        {% endfor %}
                    </select>
                </div>

                <div class="flex gap-1 mb-1">
                    <button type="button" class="btn btn-circle btn-sm"
                            :disabled="isLocked"
                            :class="isLocked ? 'btn-disabled opacity-60 cursor-not-allowed' : (collab.id ? 'btn-warning' : 'btn-primary')"
                            @click="
                                if (isLocked) { return; }
                                const id = collab.id;
                                localStorage.setItem('budget_step3_collaborator_idx', index);
                                const url = id ? `/collaborators/update/modal/${id}/` : '/collaborators/create/modal/';
                                htmx.ajax('GET', url, {target: '#modal-container', swap: 'innerHTML'});
                                document.getElementById('form_modal').showModal();">
                        <span class="material-icons text-sm" x-text="collab.id ? 'edit' : 'person_add'"></span>
                    </button>
                    
                    <button type="button" 
                            x-show="collabs.length > 1"
                            @click="removeCollab(index)" 
                            :disabled="isLocked"
                            :class="isLocked ? 'btn-disabled opacity-60 cursor-not-allowed' : 'btn-error text-white'"
                            class="btn btn-circle btn-sm">
                        <span class="material-icons text-sm">delete</span>
                    </button>
                </div>
            </div>
        </template>
    </div>

    {% if field.errors %}
        <span class="label-text-alt text-error mt-1 block">{{ field.errors.0 }}</span>
    {% endif %}

    <style>
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fadeIn {
            animation: fadeIn 0.3s ease-out forwards;
        }
    </style>

    <script id="initial-collabs-data" type="application/json">
        {{ initial_collaborators_json|safe }}
    </script>
</div>
