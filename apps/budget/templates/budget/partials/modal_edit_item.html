{% load crispy_forms_tags %}

<div class="modal-content-wrapper bg-base-100 p-6 rounded-lg">
    <!-- Header with title and buttons -->
    <div class="mb-6">
        <div class="flex items-center justify-between gap-3">
            <!-- Left side - Icon and Title -->
            <div class="flex items-center gap-3">
                <span class="material-icons text-primary text-3xl">edit</span>
                <h3 class="font-bold text-2xl text-base-content">{{ item.description|truncatewords:8 }}</h3>
                
                <!-- Calculation Indicator -->
                <div id="calculation-indicator" class="htmx-indicator flex items-center gap-2 px-3 py-1 bg-info/10 text-info rounded-full text-sm animate-pulse">
                    <span class="material-icons text-sm animate-spin">sync</span>
                    <span>Calculando...</span>
                </div>
            </div>

            <!-- Right side - Update Master button (only if NOT local item) -->
            {% if not item.is_local %}
            <button type="button"
                    class="btn btn-accent gap-2 js-update-master"
                    data-url="{% url 'budget:edit_item' budget_id item.pk %}"
                    data-action="update_master"
                    data-keep-modal-open="true">
                <span class="material-icons text-sm">cloud_upload</span>
                Atualizar Cadastro
            </button>
            {% else %}
            <div class="badge badge-warning gap-2 py-3 px-4">
                <span class="material-icons text-sm">warning</span>
                Item Local
            </div>
            {% endif %}
        </div>
    </div>

    <form hx-post="{% url 'budget:edit_item' budget_id item.pk %}"
          hx-target="#current-item-form"
          hx-swap="none"
          id="edit-item-form"
          class="space-y-4 js-save-form">
        {% csrf_token %}

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="item-fields-container">
            {% include "budget/partials/modal_edit_item_form.html" %}
        </div>
    </form>

    <!-- Action buttons (only if NOT in queue) -->
    {% if not in_queue %}
    <div class="mt-6 pt-6 border-t border-base-200 flex justify-end gap-3">
        <button type="button"
                class="btn btn-ghost"
                onclick="document.getElementById('form_modal').close()">
            <span class="material-icons text-sm">close</span>
            Cancelar
        </button>

        <button type="button"
                class="btn btn-primary gap-2 js-save-local"
                data-url="{% url 'budget:edit_item' budget_id item.pk %}"
                data-action="save_only">
            <span class="material-icons text-sm">save</span>
            Salvar
        </button>
    </div>
    {% endif %}
</div>

<script>
    (function() {
        'use strict';

        const ModalItemEditor = {
            // Auto-focus first input field
            focusFirstInput() {
                const firstInput = document.querySelector(
                    '#edit-item-form input:not([type="hidden"]):not([disabled]), ' +
                    '#edit-item-form select:not([disabled]), ' +
                    '#edit-item-form textarea:not([disabled])'
                );

                if (firstInput) {
                    setTimeout(() => firstInput.focus(), 100);
                }
            },

            // Handle update master button with loading state
            setupUpdateMasterButton() {
                const updateButton = document.querySelector('.js-update-master');

                if (!updateButton) return;

                const icon = updateButton.querySelector('.material-icons');
                const originalIconContent = icon ? icon.textContent : '';
                const form = document.getElementById('edit-item-form');
                const keepModalOpen = updateButton.dataset.keepModalOpen === 'true';

                // Remove any existing event listeners to prevent duplicates
                const newButton = updateButton.cloneNode(true);
                updateButton.parentNode.replaceChild(newButton, updateButton);

                const newIcon = newButton.querySelector('.material-icons');

                newButton.addEventListener('click', function(e) {
                    e.preventDefault();

                    if (!form) {
                        console.error('Form not found');
                        return;
                    }

                    const url = this.dataset.url;
                    const action = this.dataset.action;

                    // Show loading state
                    if (newIcon) {
                        newIcon.textContent = 'hourglass_empty';
                        newIcon.classList.add('animate-spin');
                    }

                    newButton.disabled = true;

                    // Get form data including CSRF token
                    const formData = new FormData(form);
                    formData.set('action', action); // Use set to ensure it's the correct action

                    // Trigger HTMX request with form data
                    htmx.ajax('POST', url, {
                        target: 'body',
                        swap: 'none',
                        values: Object.fromEntries(formData)
                    }).finally(() => {
                        // Reset button state after a short delay
                        setTimeout(() => {
                            if (newIcon) {
                                newIcon.textContent = originalIconContent;
                                newIcon.classList.remove('animate-spin');
                            }
                            newButton.disabled = false;
                        }, 500);
                    });
                });
            },

            // Handle save local button with loading state
            setupSaveLocalButton() {
                const saveButton = document.querySelector('.js-save-local');

                if (!saveButton) return;

                const icon = saveButton.querySelector('.material-icons');
                const originalIconContent = icon ? icon.textContent : '';
                const form = document.getElementById('edit-item-form');

                // Remove any existing event listeners
                const newButton = saveButton.cloneNode(true);
                saveButton.parentNode.replaceChild(newButton, saveButton);

                const newIcon = newButton.querySelector('.material-icons');

                newButton.addEventListener('click', function(e) {
                    e.preventDefault();

                    if (!form) {
                        console.error('Form not found');
                        return;
                    }

                    const url = this.dataset.url;
                    const action = this.dataset.action;

                    // Show loading state
                    if (newIcon) {
                        newIcon.textContent = 'hourglass_empty';
                        newIcon.classList.add('animate-spin');
                    }

                    newButton.disabled = true;

                    // Get form data including CSRF token
                    const formData = new FormData(form);
                    formData.set('action', action);

                    // Trigger HTMX request with form data - let HTMX handle the response
                    htmx.ajax('POST', url, {
                        target: 'body',
                        swap: 'none',
                        values: Object.fromEntries(formData)
                    }).finally(() => {
                        // Reset button state after a short delay
                        setTimeout(() => {
                            if (newIcon) {
                                newIcon.textContent = originalIconContent;
                                newIcon.classList.remove('animate-spin');
                            }
                            newButton.disabled = false;
                        }, 500);
                    });
                });
            },

            // Initialize all functionality
            init() {
                this.focusFirstInput();
                this.setupUpdateMasterButton();
                this.setupSaveLocalButton();
            }
        };

        // Initialize on page load
        ModalItemEditor.init();

        // Re-initialize on HTMX content swap
        document.body.addEventListener('htmx:afterSwap', function(e) {
            if (e.detail.target.id === 'current-item-form' || e.detail.target.id === 'item-fields-container') {
                ModalItemEditor.init();
            }
        });

        // Listen for closeModal event from server
        document.body.addEventListener('closeModal', function() {
            const modal = document.getElementById('form_modal');
            if (modal) {
                modal.close();
            }
        });
    })();
</script>

<style>
    /* Spin animation for loading state */
    @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }

    .animate-spin {
        animation: spin 1s linear infinite;
    }

    /* Fade-in animation for error messages */
    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(-4px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .animate-fade-in {
        animation: fadeIn 0.3s ease-out;
    }

    /* Enhanced focus states for form inputs */
    #edit-item-form input:focus,
    #edit-item-form select:focus,
    #edit-item-form textarea:focus {
        outline: 2px solid hsl(var(--p) / 0.5);
        outline-offset: 2px;
        transition: outline 0.2s ease-in-out;
    }

    /* Smooth transitions for form controls */
    .form-control {
        transition: opacity 0.2s ease-in-out;
    }
</style>
