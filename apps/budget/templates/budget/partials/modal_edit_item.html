{% load crispy_forms_tags %}

<div class="modal-content-wrapper relative">
    <!-- Header with title and Update button -->
    <div class="mb-6">
        <div class="flex items-center justify-between gap-3">
            <!-- Left side - Icon and Title -->
            <div class="flex items-center gap-3">
                <span class="material-icons text-primary text-3xl">edit</span>
                <h3 class="font-bold text-2xl text-base-content">{{ item.description|truncatewords:8 }}</h3>
            </div>

            <!-- Right side - Update Master button -->
            <button type="button"
                    hx-post="{% url 'budget:edit_item' budget_id item.pk %}"
                    hx-vals='{"action": "update_master"}'
                    hx-include="#edit-item-form"
                    hx-target="body"
                    hx-swap="none"
                    class="btn btn-accent gap-2">
                <span class="material-icons text-sm">cloud_upload</span>
                Atualizar Cadastro
            </button>
        </div>
    </div>

    <form hx-post="{% url 'budget:edit_item' budget_id item.pk %}"
          hx-vals="{'action': 'save_only'}"
          hx-target="#current-item-form"
          hx-swap="none"
          id="edit-item-form"
          class="space-y-4">
        {% csrf_token %}

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            {% for field in form %}
                <div class="form-control w-full {% if 'description' in field.name or 'descri' in field.name %}md:col-span-2{% endif %}">
                    <label class="label">
                        <span class="label-text font-semibold flex items-center gap-2">
                            {% if 'description' in field.name or 'descri' in field.name %}
                                <span class="material-icons text-sm">description</span>
                            {% elif 'quant' in field.name %}
                                <span class="material-icons text-sm">numbers</span>
                            {% elif 'price' in field.name or 'venda' in field.name %}
                                <span class="material-icons text-sm">payments</span>
                            {% elif 'cost' in field.name or 'custo' in field.name %}
                                <span class="material-icons text-sm">money_off</span>
                            {% elif 'shipping' in field.name or 'frete' in field.name %}
                                <span class="material-icons text-sm">local_shipping</span>
                            {% elif 'duration' in field.name or 'tempo' in field.name %}
                                <span class="material-icons text-sm">schedule</span>
                            {% else %}
                                <span class="material-icons text-sm">info</span>
                            {% endif %}
                            {{ field.label }}
                            {% if field.field.required %}
                                <span class="text-error">*</span>
                            {% endif %}
                        </span>
                    </label>
                    {{ field }}
                    {% if field.errors %}
                        <label class="label">
                            <span class="label-text-alt text-error flex items-center gap-1">
                                <span class="material-icons text-xs">error</span>
                                {{ field.errors.0 }}
                            </span>
                        </label>
                    {% endif %}
                </div>
            {% endfor %}
        </div>
    </form>
</div>

<script>
    (function() {
        const firstInput = document.querySelector('#edit-item-form input:not([type="hidden"]), #edit-item-form select, #edit-item-form textarea');
        if (firstInput) {
            setTimeout(() => firstInput.focus(), 100);
        }

        const updateButton = document.querySelector('[hx-vals*="update_master"]');
        if (updateButton) {
            updateButton.addEventListener('click', function() {
                const icon = this.querySelector('.material-icons');
                if (icon) {
                    const originalIcon = icon.textContent;
                    icon.textContent = 'hourglass_empty';
                    icon.classList.add('animate-spin');

                    setTimeout(() => {
                        icon.textContent = originalIcon;
                        icon.classList.remove('animate-spin');
                    }, 2000);
                }
            });
        }
    })();
</script>

<style>
    .animate-spin {
        animation: spin 1s linear infinite;
    }

    @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }

    /* Improve input focus states */
    #edit-item-form input:focus,
    #edit-item-form select:focus,
    #edit-item-form textarea:focus {
        outline: 2px solid oklch(var(--p));
        outline-offset: 2px;
    }
</style>
