<tr id="budget-item-{{ item.id }}"
    class="{% if item.is_local %}bg-warning/20{% endif %}"
    {% if not is_full_render %}hx-swap-oob="true"{% endif %}>
    {% if not step6 %}
    <td class="budget-step4-select-col text-center">
        <input
            type="checkbox"
            name="selected_product_items"
            value="{{ item.id|stringformat:'d' }}"
            class="checkbox checkbox-primary checkbox-sm budget-product-select"
        >
    </td>
    {% endif %}
    <td class="budget-step4-description">
        <div class="flex items-center gap-2 min-w-0">
            <span class="break-words whitespace-normal leading-snug">{{ item.description }}</span>
            {% if item.is_local %}
                <span class="tooltip tooltip-right shrink-0" data-tip="Item disponível somente neste orçamento. Cadastre-o para prosseguir com a aprovação do orçamento.">
                    <span class="material-icons text-warning" style="font-size: 18px;">warning</span>
                </span>
                <button type="button"
                        class="btn btn-xs btn-ghost tooltip shrink-0"
                        data-tip="Cadastrar no banco de dados"
                        hx-get="{% url 'budget:register_local_item' budget.id item.id %}"
                        hx-target="#modal-container"
                        hx-swap="innerHTML"
                        onclick="form_modal.showModal()">
                    <span class="material-icons text-accent" style="font-size: 16px;">cloud_upload</span>
                </button>
            {% endif %}
        </div>
    </td>
    <td class="text-center">{{ item.quantity }}</td>
    <td class="text-right">{{ item.product_cost_price }}</td>
    <td class="text-right">{{ item.product_selling_price }}</td>
    <td class="text-right">{{ item.shipping }}</td>
    <td class="font-bold text-right">{{ item.total_price }}</td>
    {% if not step6 %}
    <td class="text-center budget-step4-actions">
        <div class="flex justify-center items-center gap-1">
            <button type="button"
                    class="btn btn-ghost btn-xs text-info"
                    hx-get="{% url 'budget:edit_item' budget.id item.pk %}"
                    hx-target="#modal-container"
                    onclick="form_modal.showModal()">
                <span class="material-icons text-sm">edit</span>
            </button>

            <button
                type="button"
                class="btn btn-ghost btn-xs text-error"
                {% if item.is_local %}
                hx-post="{% url 'budget:remove_budget_item' budget.id item.id %}"
                {% else %}
                hx-post="{% url 'budget:remove_item_from_budget' budget.id item.product.id 'product' %}"
                {% endif %}
                data-confirm="Deseja remover este produto?"
                hx-target="closest tr"
                hx-swap="outerHTML">
                <span class="material-icons text-sm">delete</span>
            </button>
        </div>
    </td>
    {% endif %}
</tr>
