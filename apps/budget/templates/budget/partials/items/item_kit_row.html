<tr id="budget-item-{{ item.id }}"
    {% if not is_full_render %}hx-swap-oob="true"{% endif %}>

    <td class="budget-step4-description break-words whitespace-normal leading-snug">{{ item.kit.name }}</td>
    <td class="text-center">{{ item.quantity }}</td>
    <td class="text-center">{{ item.effective_kit_products_count }}</td>
    <td class="text-center">{{ item.effective_kit_services_count }}</td>

    <!-- AÇÕES -->
    <td class="text-center budget-step4-actions">
        {% if step6 %}
            <!-- BOTÃO VISUALIZAR (OLHO) -->
            <button
                type="button"
                class="btn btn-ghost btn-xs"
                onclick="openKitModal(this)"
                data-kit-name="{{ item.kit.name }}"
                data-kit-products-list="{% for p in item.effective_kit_products %}{{ p.name }}{% if not forloop.last %} | {% endif %}{% endfor %}"
                data-kit-services-list="{% for s in item.effective_kit_services %}{{ s.name }}{% if not forloop.last %} | {% endif %}{% endfor %}"
            >
                <span class="material-icons text-sm">visibility</span>
            </button>
        {% else %}
            <div class="flex justify-center items-center gap-1">
                <!-- EDITAR -->
                <button type="button"
                        class="btn btn-ghost btn-xs text-info"
                        hx-get="{% url 'budget:edit_kit' budget.id item.pk %}"
                        hx-target="#modal-container"
                        onclick="form_modal.showModal()">
                    <span class="material-icons text-sm">edit</span>
                </button>

                <!-- REMOVER -->
                <button
                    type="button"
                    class="btn btn-ghost btn-xs text-error"
                    hx-post="{% url 'budget:remove_item_from_budget' budget.id item.kit.id 'kit' %}"
                    data-confirm="Deseja remover este kit?"
                    hx-target="closest tr"
                    hx-swap="outerHTML">
                    <span class="material-icons text-sm">delete</span>
                </button>
            </div>
        {% endif %}
    </td>
</tr>
