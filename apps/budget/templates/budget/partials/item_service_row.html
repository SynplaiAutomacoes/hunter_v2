<tr id="service-item-{{ item.service.id }}" {% if not is_full_render %}hx-swap-oob="true"{% endif %}>
    <td>{{ item.service.name }}</td>
    <td class="text-center">{{ item.quantity }}</td>
    <td>{{ item.service_selling_price }}</td>
    <td>{{ item.duration_display }}</td>
    <td class="font-bold">{{ item.total_price }}</td>
    {% if not step6 %}
    <td class="text-center">
        <button
            type="button"
            class="btn btn-ghost btn-xs text-error"
            hx-post="{% url 'budget:remove_item_from_budget' budget.id item.service.id 'service' %}"
            hx-confirm="Deseja remover uma unidade deste serviço?"
            hx-target="closest tr"
            hx-swap="outerHTML">
            <span class="material-icons text-sm">delete</span>
        </button>
    </td>
    {% endif %}
</tr>
