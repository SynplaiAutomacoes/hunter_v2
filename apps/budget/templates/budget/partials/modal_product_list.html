<div class="modal-box max-w-4xl bg-base-100 shadow-2xl">
    <h3 class="font-bold text-2xl mb-6 flex items-center gap-2">
        <span class="material-icons">inventory_2</span> Selecionar Produto
    </h3>

    <div class="overflow-x-auto max-h-96">
        <table class="table table-zebra w-full">
            <thead>
                <tr>
                    <th>Código</th>
                    <th>Descrição</th>
                    <th>Preço Venda</th>
                    <th class="text-center">Ação</th>
                </tr>
            </thead>
            <tbody>
                {% for product in products %}
                <tr>
                    <td>{{ product.code }}</td>
                    <td><strong>{{ product.name }}</strong><br><small>{{ product.brand }}</small></td>
                    <td>{{ product.selling_price }}</td>
                    <td class="text-center">
                        <button class="btn btn-sm btn-success"
                                hx-post="{% url 'budget:add_product_to_budget' budget.id product.id %}"
                                hx-target="#product-list-body"
                                hx-swap="beforeend"
                                onclick="form_modal.close()">
                            Adicionar
                        </button>
                    </td>
                </tr>
                {% empty %}
                <tr><td colspan="4" class="text-center">Nenhum produto encontrado.</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

    <div class="modal-action">
        <button type="button" class="btn btn-ghost" onclick="form_modal.close()">Fechar</button>
    </div>
</div>
