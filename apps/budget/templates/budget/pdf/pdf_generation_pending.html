<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }}</title>
    {% if refresh_seconds > 0 %}
        <meta http-equiv="refresh" content="{{ refresh_seconds }}">
    {% endif %}
</head>
<body style="margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;color:#1f2937;display:flex;align-items:center;justify-content:center;min-height:100vh;">
    <main style="max-width:32rem;width:100%;background:white;border:1px solid #e5e7eb;border-radius:1rem;padding:2rem;box-shadow:0 10px 30px rgba(15,23,42,.08);text-align:center;">
        <div style="width:3rem;height:3rem;border-radius:9999px;border:4px solid #dbeafe;border-top-color:#2563eb;margin:0 auto 1rem;animation:spin 1s linear infinite;"></div>
        <h1 style="font-size:1.25rem;margin:0 0 .75rem;">{{ title }}</h1>
        <p style="margin:0 0 1rem;line-height:1.5;">{{ message }}</p>
        <p style="margin:0;color:#6b7280;font-size:.875rem;">A janela será atualizada automaticamente em alguns segundos.</p>
        {% if error_message %}
            <p style="margin:1rem 0 0;color:#b91c1c;font-size:.875rem;">{{ error_message }}</p>
        {% endif %}
    </main>
    <style>
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</body>
</html>
