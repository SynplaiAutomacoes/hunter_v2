<div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
    <div>
        <label for="{{ table_id }}-filter-collaborator-type">Tipo</label>
        <select name="collaborator_type" id="{{ table_id }}-filter-collaborator-type" class="select select-bordered w-full">
            <option value="">Todos</option>
            {% for value, label in collaborator_type_choices %}
                {% if value %}
                    <option value="{{ value }}" {% if request.GET.collaborator_type == value %}selected{% endif %}>{{ label }}</option>
                {% endif %}
            {% endfor %}
        </select>
    </div>

    <div>
        <label for="{{ table_id }}-filter-status">Status</label>
        <select name="is_active" id="{{ table_id }}-filter-status" class="select select-bordered w-full">
            <option value="">Ativos</option>
            <option value="all" {% if request.GET.is_active == 'all' %}selected{% endif %}>Todos</option>
            <option value="0" {% if request.GET.is_active == '0' %}selected{% endif %}>Inativo</option>
        </select>
    </div>

    <div>
        <label for="{{ table_id }}-filter-system-access">Acesso ao Sistema</label>
        <select name="system_access" id="{{ table_id }}-filter-system-access" class="select select-bordered w-full">
            <option value="">Todos</option>
            <option value="1" {% if request.GET.system_access == '1' %}selected{% endif %}>Com acesso</option>
            <option value="0" {% if request.GET.system_access == '0' %}selected{% endif %}>Sem acesso</option>
        </select>
    </div>

    <div>
        <label for="{{ table_id }}-filter-position">Cargo</label>
        <input
            type="text"
            name="position"
            id="{{ table_id }}-filter-position"
            value="{{ request.GET.position|default:'' }}"
            placeholder="Digite o cargo"
            class="input-theme"
        />
    </div>
</div>
