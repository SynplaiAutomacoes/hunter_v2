<dialog
    class="modal"
    x-ref="syncMonthlyCostsModal"
    @click="if ($event.target === $el) $el.close()"
>
    <div class="modal-box w-11/12 max-w-lg border border-base-300 bg-base-100 shadow-2xl">
        <h3 class="text-lg font-semibold text-base-content">Atualizar custo mensal da oficina?</h3>
        <p class="mt-2 text-sm leading-6 text-base-content/70">
            Deseja atualizar o custo mensal da oficina deste mês com os salários e vale transporte dos colaboradores?
        </p>
        <div class="modal-action mt-6 flex flex-col-reverse gap-2 sm:flex-row sm:items-center sm:justify-end border-t border-base-200 pt-4">
            <button type="button" class="btn-form-cancel" @click="confirmSyncMonthlyCosts(false)">
                Não, só salvar
            </button>
            <button type="button" class="btn btn-primary" @click="confirmSyncMonthlyCosts(true)">
                Sim, atualizar
            </button>
        </div>
    </div>
</dialog>
