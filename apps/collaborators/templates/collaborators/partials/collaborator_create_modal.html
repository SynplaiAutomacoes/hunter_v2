<div class="modal-box w-11/12 max-w-2xl">
    <h3 class="font-bold text-lg mb-4">Adicionar Colaborador</h3>

    <form hx-post='collaborators:collaborator_create' hx-swap='outerHTML' onsubmit="form_modal.close()">
        {% csrf_token %}

        <div class="grid grid-cols-2 gap-4">
            {% for field in form %}
                <div class="form-control w-full">
                    <label class="label">
                        <span class="label-text">{{ field.label }}</span>
                    </label>
                    {{ field }}
                    {% if field.errors %}
                        <span class="text-error text-sm">{{ field.errors }}</span>
                    {% endif %}
                </div>
            {% endfor %}
        </div>

        <div class="modal-action">
            <button type="button" class="btn" onclick="form_modal.close()">Cancelar</button>

            <button type="button"
                    hx-post="{% url 'collaborators:collaborator_create' %}"
                    hx-swap="outerHTML"
                    hx-vals='{"action": "create_collaborator"}'
                    hx-include="closest form"
                    class="btn btn-primary">Criar
            </button>
        </div>
    </form>
</div>
