{% load crispy_forms_tags %}

<div class="modal-box w-11/12 max-w-4xl bg-base-100 relative">
    <button class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2" onclick="form_modal.close()">✕</button>

    <h3 class="font-bold text-2xl mb-6 text-center">Adicionar Novo Colaborador</h3>

    <form hx-post="{% url 'collaborators:collaborator_create_modal' %}"
          hx-target="#modal-container"
          hx-swap="innerHTML"
          class="w-full">
        {% csrf_token %}

        {% crispy form %}

        <div class="modal-action mt-6 flex justify-end gap-2">
            <button type="button" class="btn btn-ghost" onclick="form_modal.close()">Cancelar</button>
            <button type="submit" class="btn btn-primary px-8">Salvar Colaborador</button>
        </div>
    </form>
</div>
