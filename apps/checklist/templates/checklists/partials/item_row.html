<tr class="hover:bg-base-200 transition-colors">
    <input type="hidden" name="agrupamento" value="{{ group }}">
    <input type="hidden" name="descricao" value="{{ description }}">
    <input type="hidden" name="tipo_resposta" value="{{ response_type }}">

    <td class="font-mono text-xs row-index">#</td>
    <td class="font-mono text-xs">{{ group|default:"Sem Grupo" }} / {{ description }}</td>
    <td class="font-mono text-xs">{{ response_type_display }}</td>
    <!-- Botão de Remover -->
    <td>
        {% with modal_id="modal-"|add:description|slugify %}
        <label for="{{ modal_id }}" class="btn btn-ghost btn-xs text-error">
            <span class="material-icons text-sm">delete</span>
        </label>

        <input type="checkbox" id="{{ modal_id }}" class="modal-toggle" />
        <div class="modal" role="dialog">
            <div class="modal-box">
                <h3 class="text-lg font-bold text-base-content">Remover Item</h3>
                <p class="text-base-content/70 mt-1">Este item será removido da lista do checklist.</p>

                <div class="alert alert-warning mt-4">
                    <svg xmlns="http://www.w3.org/2000/svg" class="stroke-current shrink-0 h-6 w-6" fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>
                    <div>
                        <div class="font-semibold">Confirmar remoção</div>
                        <div class="text-sm">Remover: <span class="font-medium">{{ group|default:"Sem Grupo" }} / {{ description }}</span>?</div>
                    </div>
                </div>

                <div class="modal-action">
                    <label for="{{ modal_id }}" class="btn btn-ghost">Cancelar</label>
                    <label for="{{ modal_id }}"
                           class="btn btn-error"
                           onclick="const tr = this.closest('tr'); setTimeout(() => { tr.remove(); reorderRows(); }, 200);">
                        Remover
                    </label>
                </div>
            </div>
            <label class="modal-backdrop" for="{{ modal_id }}">Close</label>
        </div>
        {% endwith %}
    </td>
</tr>
